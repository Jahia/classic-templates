# Nightly integration tests against the Jahia snapshot image. TestRail and PagerDuty are
# off until the module has a TestRail project and a PagerDuty service.
name: Nightly Test run (Jahia SN)

on:
  workflow_dispatch:
  schedule:
    - cron: "0 2 * * *"

jobs:
  integration-tests:
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    secrets: inherit
    with:
      jahia_image: ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT
      module_id: classic-templates
      should_skip_testrail: true
      pagerduty_skip_notification: true
      provisioning_manifest: provisioning-manifest-snapshot.yml
      artifact_prefix: classic-templates
      module_branch: ${{ github.ref }}
