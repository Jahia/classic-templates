# Runs on every pull request: signature, static checks of the JavaScript packages, the Maven build
# of the three packages (template set, classic-travel, pre-packaged site), Sonar and the
# integration tests (they install every *-SNAPSHOT.jar and *-SNAPSHOT.tgz the build produced).
name: On Code Change (PR)

on:
  pull_request:
    types: [opened, reopened, synchronize]
    # Changelog-only and documentation-only PRs (the chachalog release PR among them) change no
    # code: skip the build, Sonar and the integration tests for them.
    paths-ignore:
      - ".chachalog/**"
      - "CHANGELOG.md"
      - "**/*.md"
      - "docs/**"

jobs:
  update-signature:
    name: Update module signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: jahia/jahia-modules-action/update-signature@v2
        with:
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  static-checks:
    name: Static checks (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [template-set, travel]
    defaults:
      run:
        working-directory: packages/${{ matrix.package }}
    steps:
      - uses: actions/checkout@v4
      # mise.toml pins Node 22 and Yarn 4; the root .yarnrc.yml hands over to the committed Yarn
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4.2.4
      - run: yarn install --immutable
      - name: Lint and format
        run: |
          yarn lint
          yarn prettier --check .
      - name: No literal colours
        run: yarn check:tokens
      - name: Theme contrast
        if: matrix.package == 'template-set'
        run: yarn check:contrast
      - name: Unit tests
        run: yarn test:unit
        env:
          TZ: UTC

  build:
    name: Build Module
    needs: update-signature
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: jahia/jahia-modules-action/build@v2
        with:
          mvn_settings_filepath: ".github/maven.settings.xml"
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  sonar-analysis:
    name: Sonar Analysis
    needs: build
    runs-on: ubuntu-latest
    env:
      NEXUS_INTERNAL_URL: ${{ secrets.NEXUS_INTERNAL_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: jahia/jahia-modules-action/sonar-analysis@v2
        with:
          primary_release_branch: main
          github_slug: jahia/classic-templates
          github_pr_id: ${{ github.event.number }}
          sonar_url: ${{ secrets.SONAR_URL }}
          sonar_token: ${{ secrets.SONAR_TOKEN }}
          nexus_username: ${{ secrets.NEXUS_USERNAME }}
          nexus_password: ${{ secrets.NEXUS_PASSWORD }}

  integration-tests:
    uses: Jahia/jahia-modules-action/.github/workflows/reusable-integration-tests.yml@v2
    secrets: inherit
    needs: build
    with:
      jahia_image: ghcr.io/jahia/jahia-ee-dev:8-SNAPSHOT
      module_id: classic-templates
      should_skip_testrail: true
      pagerduty_skip_notification: true
      provisioning_manifest: provisioning-manifest-build.yml
      artifact_prefix: classic-templates
      module_branch: ${{ github.ref }}
