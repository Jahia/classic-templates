# Editor labels for classic-media. Keys are derived from the DECLARING type (a mixin's fields are
# keyed on the mixin), ':' becomes '_', choicelist values are <type>.<property>.<value>, and a
# type's help text is <type>_description. Fields inherited from classic-templates mixins
# (ctplmix:media, ctplmix:editorialItem, ctplmix:cta, ctplmix:sectionStyle) keep the classic-templates labels.

# ---- Component tiers ----------------------------------------------------------------------------
ctmdmix_component=Media
ctmdmix_component_description=Stories, people, sessions and media sections of the classic-media module.
ctmdmix_pageComponent=Media section
ctmdmix_pageComponent_description=A media section that can be placed in the page areas of classic-templates.

# ---- Event folder -------------------------------------------------------------------------------
ctmdmix_eventFolder=Event
ctmdmix_eventFolder.ctmdTimeZone=Time zone
ctmdmix_eventFolder.ctmdTimeZone.ui.tooltip=Time zone the event runs in, as an IANA name such as Europe/Lisbon or America/New_York. The sessions in this folder, and the agenda and key dates that look under it, show their times in this zone.

# ---- Credited media -----------------------------------------------------------------------------
ctmdmix_credited=Credit
ctmdmix_credited_description=Who to credit for a picture or video. Stories and briefs show it as a caption under the image.
ctmdmix_credited.ctmdCredit=Credit
ctmdmix_credited.ctmdCredit.ui.tooltip=Who to credit for this picture or video, exactly as it must appear (for example Sofia Marques / Northlight Pictures). It is the same in every language.

# ---- Person -------------------------------------------------------------------------------------
ctmd_person=Person
ctmd_person_description=A member of the editorial team or a speaker, with their own page listing their stories and sessions.
ctmd_person.jcr_title=Full name
ctmd_person.jcr_title.ui.tooltip=The person's name as shown on cards, bylines and their page, for example "Mara Lindqvist".
ctmd_person.role=Role
ctmd_person.role.ui.tooltip=Job title or role, for example "Senior editor" or "Head of streaming".
ctmd_person.organisation=Organisation
ctmd_person.organisation.ui.tooltip=Company or organisation the person works for, shown after their role. Leave empty for the editorial team.
ctmd_person.sortName=Sort name
ctmd_person.sortName.ui.tooltip=Name the person is filed under in an A-Z index, usually the family name. Leave empty to use the last word of the full name.
ctmd_person.teaser=Short bio
ctmd_person.teaser.ui.tooltip=One or two sentences shown on cards and used as the description of the person's page in search engines.
ctmd_person.bio=Biography
ctmd_person.bio.ui.tooltip=Full biography shown on the person's page. Headings inside start at level 2.

# ---- Story --------------------------------------------------------------------------------------
ctmd_story=Story
ctmd_story_description=A story of the editorial hub: news, feature, opinion, interview, report, video or podcast, with its own page.
ctmd_story.format=Format
ctmd_story.format.ui.tooltip=Kind of story. It is shown as a label on cards and pages, lets feeds keep only some formats, and decides what the page shows (a video, an audio player).
ctmd_story.format.news=News
ctmd_story.format.feature=Feature
ctmd_story.format.opinion=Opinion
ctmd_story.format.interview=Interview
ctmd_story.format.report=Report
ctmd_story.format.video=Video
ctmd_story.format.podcast=Podcast
ctmd_story.authors=Authors
ctmd_story.authors.ui.tooltip=People who wrote the story, in byline order. Each name links to the person's page.
ctmd_story.video=Video
ctmd_story.video.ui.tooltip=For a video story: a video of the media gallery (internal with captions, or external), shown at the top of the page. Leave empty for other formats.
ctmd_story.audio=Audio file
ctmd_story.audio.ui.tooltip=For a podcast story: the episode's audio file from the media library, played on the page. Always add its transcript.
ctmd_story.audioCaptions=Audio captions
ctmd_story.audioCaptions.ui.tooltip=WebVTT captions of the episode in this language (a .vtt file of the media library). The page shows the audio player only with captions; without them it offers the file to download and the transcript.
ctmd_story.transcript=Transcript
ctmd_story.transcript.ui.tooltip=Full text of the audio or video, for people who cannot hear it and for search engines. Shown under the player.

# ---- Story feed ---------------------------------------------------------------------------------
ctmd_storyFeed=Story feed
ctmd_storyFeed_description=Lists stories automatically, newest first: the stories of a topic, the latest videos, the reports of a theme.
ctmd_storyFeed.jcr_title=Title
ctmd_storyFeed.jcr_title.ui.tooltip=Heading of the section, for example "Latest in streaming". Optional.
ctmd_storyFeed.startNode=Look under
ctmd_storyFeed.startNode.ui.tooltip=Folder or page under which to look for stories. Leave empty to list stories from the whole site. A folder of another site can be picked.
ctmd_storyFeed.pageCategories=Stories of this page's topics
ctmd_storyFeed.pageCategories.ui.tooltip=Only list stories filed under one of the categories of the page showing the feed. Use it on topic pages: give the page its topic as a category.
ctmd_storyFeed.filterCategories=Categories
ctmd_storyFeed.filterCategories.ui.tooltip=Only list stories in one of these categories, or in one of their subcategories. Leave empty to list stories of every category.
ctmd_storyFeed.formats=Formats
ctmd_storyFeed.formats.ui.tooltip=Only list stories of these formats. Leave empty to list every format.
ctmd_storyFeed.formats.news=News
ctmd_storyFeed.formats.feature=Feature
ctmd_storyFeed.formats.opinion=Opinion
ctmd_storyFeed.formats.interview=Interview
ctmd_storyFeed.formats.report=Report
ctmd_storyFeed.formats.video=Video
ctmd_storyFeed.formats.podcast=Podcast
ctmd_storyFeed.maxItems=Number of stories
ctmd_storyFeed.maxItems.ui.tooltip=How many of the latest stories the feed shows, from 1 to 50. Add a "see all" button to link to the full list.
ctmd_storyFeed.layout=Layout
ctmd_storyFeed.layout.ui.tooltip=Grid of cards, list of compact rows, or the newest story shown large above a grid of the others.
ctmd_storyFeed.layout.grid=Grid of cards
ctmd_storyFeed.layout.list=Compact list
ctmd_storyFeed.layout.lead=Lead story and grid
ctmd_storyFeed.showFilter=Format buttons
ctmd_storyFeed.showFilter.ui.tooltip=Adds buttons above the stories to show one format at a time. Without JavaScript every story stays visible.
ctmd_storyFeed.noResultText=Text when nothing matches
ctmd_storyFeed.noResultText.ui.tooltip=Shown when no story matches. Leave empty to hide the whole section in that case.

# ---- Session ------------------------------------------------------------------------------------
ctmd_session=Session
ctmd_session_description=A session of an event's programme (talk, panel, workshop, break) with its own page, shown in the agenda.
ctmd_session.jcr_title=Title
ctmd_session.jcr_title.ui.tooltip=Title of the session as shown in the agenda and on its page.
ctmd_session.start=Starts
ctmd_session.start.ui.tooltip=Day and time the session starts, in the event's time zone (set on the event's folder).
ctmd_session.end=Ends
ctmd_session.end.ui.tooltip=Day and time the session ends, the same day as its start.
ctmd_session.room=Room
ctmd_session.room.ui.tooltip=Where the session takes place, for example "Main stage" or "Room B2".
ctmd_session.stream=Stream
ctmd_session.stream.ui.tooltip=Programme strand the session belongs to, for example "Conference" or "Technical papers". The agenda filters on it.
ctmd_session.sessionType=Type
ctmd_session.sessionType.ui.tooltip=Kind of session, shown as a label in the agenda and on the page. The agenda filters on it.
ctmd_session.sessionType.keynote=Keynote
ctmd_session.sessionType.talk=Talk
ctmd_session.sessionType.panel=Panel
ctmd_session.sessionType.workshop=Workshop
ctmd_session.sessionType.fireside=Fireside chat
ctmd_session.sessionType.break=Break
ctmd_session.teaser=Summary
ctmd_session.teaser.ui.tooltip=One or two sentences shown in the agenda and used as the description of the session's page in search engines.
ctmd_session.body=Description
ctmd_session.body.ui.tooltip=Full description shown on the session's page. Headings inside start at level 2.
ctmd_sessionSpeaker=Speaker
ctmd_sessionSpeaker_description=One speaker of a session: a person and the part they play.
ctmd_sessionSpeaker.person=Person
ctmd_sessionSpeaker.person.ui.tooltip=The speaker, picked among the people of the site. Their name, role and portrait come from their own page.
ctmd_sessionSpeaker.speakerRole=Part
ctmd_sessionSpeaker.speakerRole.ui.tooltip=The part the person plays in this session, shown after their name.
ctmd_sessionSpeaker.speakerRole.speaker=Speaker
ctmd_sessionSpeaker.speakerRole.keynote=Keynote speaker
ctmd_sessionSpeaker.speakerRole.moderator=Moderator
ctmd_sessionSpeaker.speakerRole.panellist=Panellist
ctmd_sessionSpeaker.speakerRole.host=Host

# ---- Agenda -------------------------------------------------------------------------------------
ctmd_agenda=Agenda
ctmd_agenda_description=An event's programme: one tab per day, sessions in time order, with filters.
ctmd_agenda.jcr_title=Title
ctmd_agenda.jcr_title.ui.tooltip=Heading of the section, for example "Programme". Optional.
ctmd_agenda.startNode=Look under
ctmd_agenda.startNode.ui.tooltip=The event's folder, holding its sessions. Leave empty to list the sessions of the whole site.
ctmd_agenda.showFilters=Filters
ctmd_agenda.showFilters.ui.tooltip=Adds filters on stream, room and type above the sessions. Without JavaScript every session stays visible.
ctmd_agenda.noResultText=Text when there is no session
ctmd_agenda.noResultText.ui.tooltip=Shown when the folder holds no session yet, for example "The programme will be published in May". Leave empty to hide the section.

# ---- Speaker gallery ----------------------------------------------------------------------------
ctmd_speakerGallery=Speaker gallery
ctmd_speakerGallery_description=Portrait cards of the people in a folder, sorted by name, with an optional A-Z index.
ctmd_speakerGallery.jcr_title=Title
ctmd_speakerGallery.jcr_title.ui.tooltip=Heading of the section, for example "Speakers". Optional.
ctmd_speakerGallery.startNode=Look under
ctmd_speakerGallery.startNode.ui.tooltip=Folder holding the people to show, for example the event's speakers. Leave empty to show every person of the site.
ctmd_speakerGallery.maxItems=Number of people
ctmd_speakerGallery.maxItems.ui.tooltip=How many people the gallery shows at most, from 1 to 200, in name order.
ctmd_speakerGallery.showIndex=A-Z index
ctmd_speakerGallery.showIndex.ui.tooltip=Adds a row of letters above the cards, each a link to the first person filed under it.
ctmd_speakerGallery.noResultText=Text when nobody is listed
ctmd_speakerGallery.noResultText.ui.tooltip=Shown when the folder holds nobody yet. Leave empty to hide the section.

# ---- Key dates ----------------------------------------------------------------------------------
ctmd_keyDates=Key dates
ctmd_keyDates_description=The dates and venue of an event, an optional countdown, and the key dates before it.
ctmd_keyDates.jcr_title=Title
ctmd_keyDates.jcr_title.ui.tooltip=Heading of the section, for example "Orvane Live 2027". Optional.
ctmd_keyDates.eventStart=First day
ctmd_keyDates.eventStart.ui.tooltip=First day of the event.
ctmd_keyDates.eventEnd=Last day
ctmd_keyDates.eventEnd.ui.tooltip=Last day of the event. Leave empty for a one-day event.
ctmd_keyDates.venue=Venue
ctmd_keyDates.venue.ui.tooltip=Where the event takes place, for example "Harbour Exhibition Centre, Lisbon".
ctmd_keyDates.showCountdown=Countdown
ctmd_keyDates.showCountdown.ui.tooltip=Shows how many days are left before the first day ("Starts in 12 days"), then "Happening now" during the event. Needs JavaScript; nothing shows without it.
ctmd_keyDate=Key date
ctmd_keyDate_description=One date of an event's calendar, such as "Registration opens".
ctmd_keyDate.jcr_title=Title
ctmd_keyDate.jcr_title.ui.tooltip=What happens on that day, for example "Early-bird rate ends".
ctmd_keyDate.date=Date
ctmd_keyDate.date.ui.tooltip=The day of this key date.
ctmd_keyDate.detail=Detail
ctmd_keyDate.detail.ui.tooltip=A short line shown under the title, for example "Save 30% on the full pass". Optional.

# ---- Search results -----------------------------------------------------------------------------
ctmd_searchResults=Search results
ctmd_searchResults_description=A search box with suggestions, filters (topics, tags, format, type, site) and the Augmented Search results, on this page.
ctmd_searchResults.jcr_title=Title
ctmd_searchResults.jcr_title.ui.tooltip=Heading of the section, for example "Search". Optional.
ctmd_searchResults.scope=Search in
ctmd_searchResults.scope.ui.tooltip=This site only, or this site and every site its network bar links to.
ctmd_searchResults.scope.site=This site
ctmd_searchResults.scope.network=This site and its network
ctmd_searchResults.pageSize=Results per page
ctmd_searchResults.pageSize.ui.tooltip=How many results a page shows, from 5 to 50, with links to the previous and next results.
ctmd_searchResults.noResultText=Text when nothing matches
ctmd_searchResults.noResultText.ui.tooltip=Shown when no content matches the words typed. Leave empty for the default text.

# ---- Brief --------------------------------------------------------------------------------------
ctmd_brief=Brief
ctmd_brief_description=What the media group needs from its photo and video suppliers: the deadline, the kinds of media, how many, what for. Has its own page.
ctmd_brief.jcr_title=Title
ctmd_brief.jcr_title.ui.tooltip=Name of the brief as suppliers read it on cards and on its page, for example "Streaming summit: crowd and stage photos".
ctmd_brief.description=Description
ctmd_brief.description.ui.tooltip=What is needed, in the supplier's words: subjects, style, technical requirements. Shown on the brief's page.
ctmd_brief.deadline=Deadline
ctmd_brief.deadline.ui.tooltip=Last day to send submissions. Briefs are listed with the nearest deadline first. Closing a brief is a separate choice (Status): a date alone does not close it.
ctmd_brief.mediaWanted=Media wanted
ctmd_brief.mediaWanted.ui.tooltip=Photos, videos or both.
ctmd_brief.mediaWanted.photo=Photos
ctmd_brief.mediaWanted.video=Videos
ctmd_brief.quantity=Quantity
ctmd_brief.quantity.ui.tooltip=How many photos or videos are wanted, from 1 to 10000. Leave empty when there is no set number.
ctmd_brief.usage=Intended use
ctmd_brief.usage.ui.tooltip=What the media will be used for. Suppliers see it on the brief's page.
ctmd_brief.usage.storyIllustration=Story illustration
ctmd_brief.usage.social=Social media
ctmd_brief.usage.eventScreens=Event screens
ctmd_brief.briefStatus=Status
ctmd_brief.briefStatus.ui.tooltip=An open brief is listed and accepts submissions. A closed brief leaves the lists that show open briefs only, and its page says it no longer accepts submissions.
ctmd_brief.briefStatus.open=Open
ctmd_brief.briefStatus.closed=Closed
ctmd_brief.referenceImage=Mood picture
ctmd_brief.referenceImage.ui.tooltip=A picture that shows the look and feel wanted. Shown on the brief's page; its text alternative is the picture's title in the media library, so give it one.
ctmd_brief.submissionForm=Submission form
ctmd_brief.submissionForm.ui.tooltip=The Formidable form suppliers answer this brief with. It is shown on the brief's page while the brief is open; a closed brief shows a short notice instead. Leave empty to show no form.

# ---- Submission ---------------------------------------------------------------------------------
ctmd_submission=Submission
ctmd_submission_description=What a supplier sent in answer to a brief: photos or videos with their caption, credit and licence, and the picture desk's follow-up. Shown as a status card in the submission list. No page of its own.
ctmd_submission.jcr_title=Title
ctmd_submission.jcr_title.ui.tooltip=Title of the submission, shown on its status card. It is read in whichever language it was typed in.
ctmd_submission.caption=Caption
ctmd_submission.caption.ui.tooltip=Describes what the pictures show. Typed once by the supplier, in one language.
ctmd_submission.credit=Credit
ctmd_submission.credit.ui.tooltip=How the pictures are credited when published, for example "Mara Lindqvist / Studio Nord".
ctmd_submission.licence=Licence
ctmd_submission.licence.ui.tooltip=What the supplier allows: editorial use on every site of the group, or exclusive to the group for 30 days.
ctmd_submission.licence.editorial=Editorial use on every site of the group
ctmd_submission.licence.exclusive30=Exclusive for 30 days
ctmd_submission.shotDate=Shooting date
ctmd_submission.shotDate.ui.tooltip=The day the pictures were taken.
ctmd_submission.location=Location
ctmd_submission.location.ui.tooltip=Where the pictures were taken, in the supplier's words.
ctmd_submission.media=Photos and videos
ctmd_submission.media.ui.tooltip=The photo and video files of the submission, from the media library. The status card shows small thumbnails of the first photos.
ctmd_submission.captionsFiles=Caption files
ctmd_submission.captionsFiles.ui.tooltip=WebVTT files (.vtt) that caption the videos.
ctmd_submission.brief=Brief
ctmd_submission.brief.ui.tooltip=The brief this answers. The status card links it, for visitors who may read it.
ctmd_submission.submissionStatus=Status
ctmd_submission.submissionStatus.ui.tooltip=Where the submission stands. The supplier reads it on the status card, as text with a mark.
ctmd_submission.submissionStatus.submitted=Submitted
ctmd_submission.submissionStatus.inReview=In review
ctmd_submission.submissionStatus.accepted=Accepted
ctmd_submission.submissionStatus.declined=Declined
ctmd_submission.deskNote=Picture desk note
ctmd_submission.deskNote.ui.tooltip=A note from the picture desk to the supplier, for example why a submission was declined. Shown on the status card; published like the rest of the submission.
ctmd_submission.usedIn=Used in
ctmd_submission.usedIn.ui.tooltip=The published item, such as a story, that uses the accepted media. The status card links it for an accepted submission.
ctmd_submission.company=Company
ctmd_submission.company.ui.tooltip=The supplier's company. Set when the supplier sends the submission.
ctmd_submission.submittedBy=Submitted by
ctmd_submission.submittedBy.ui.tooltip=The user who sent the submission. Set when the supplier sends it.

# ---- Brief list ---------------------------------------------------------------------------------
ctmd_briefList=Brief list
ctmd_briefList_description=Lists the briefs the visitor may read, the nearest deadline first. Two visitors can see two different lists.
ctmd_briefList.jcr_title=Title
ctmd_briefList.jcr_title.ui.tooltip=Heading of the section, for example "Open briefs". Optional.
ctmd_briefList.folder=Look under
ctmd_briefList.folder.ui.tooltip=Content folder (or any node) under which to look for briefs. Leave empty to look in the whole site. Briefs the visitor may not read are left out.
ctmd_briefList.showClosed=Show closed briefs
ctmd_briefList.showClosed.ui.tooltip=Off: only open briefs are listed. On: closed briefs are listed too, with a "Closed" label.
ctmd_briefList.maxItems=Number of briefs
ctmd_briefList.maxItems.ui.tooltip=How many briefs the list shows at most, from 1 to 100. Add a "see all" button to link to a fuller list.
ctmd_briefList.emptyText=Text when nothing is listed
ctmd_briefList.emptyText.ui.tooltip=Shown when the visitor has no brief to read. Leave empty to hide the whole section in that case.

# ---- Submission list ----------------------------------------------------------------------------
ctmd_submissionList=Submission list
ctmd_submissionList_description=Lists the submissions the visitor may read, the newest first, as status cards. A supplier sees their own.
ctmd_submissionList.jcr_title=Title
ctmd_submissionList.jcr_title.ui.tooltip=Heading of the section, for example "My submissions". Optional.
ctmd_submissionList.folder=Look under
ctmd_submissionList.folder.ui.tooltip=Content folder (or any node) under which to look for submissions. Leave empty to look in the whole site. Submissions the visitor may not read are left out.
ctmd_submissionList.maxItems=Number of submissions
ctmd_submissionList.maxItems.ui.tooltip=How many of the newest submissions the list shows, from 1 to 100. Add a "see all" button to link to a fuller list.
ctmd_submissionList.emptyText=Text when nothing is listed
ctmd_submissionList.emptyText.ui.tooltip=Shown when the visitor has no submission to read. Leave empty to hide the whole section in that case.
