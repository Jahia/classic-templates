# Libellés éditeur de classic-media. Voir classic-media_en.properties pour les règles de clés.

# ---- Niveaux de composants ----------------------------------------------------------------------
ctmdmix_component=Média
ctmdmix_component_description=Articles, personnes, sessions et sections du module classic-media.
ctmdmix_pageComponent=Section média
ctmdmix_pageComponent_description=Une section média qui se place dans les zones des pages de classic-templates.

# ---- Dossier d'événement ------------------------------------------------------------------------
ctmdmix_eventFolder=Événement
ctmdmix_eventFolder.ctmdTimeZone=Fuseau horaire
ctmdmix_eventFolder.ctmdTimeZone.ui.tooltip=Fuseau horaire de l'événement, sous forme de nom IANA comme Europe/Lisbon ou America/New_York. Les sessions de ce dossier, ainsi que l'agenda et les dates clés qui le parcourent, affichent leurs horaires dans ce fuseau.

# ---- Médias crédités ----------------------------------------------------------------------------
ctmdmix_credited=Crédit
ctmdmix_credited_description=Qui créditer pour une image ou une vidéo. Les articles et les briefs l'affichent en légende sous l'image.
ctmdmix_credited.ctmdCredit=Crédit
ctmdmix_credited.ctmdCredit.ui.tooltip=Qui créditer pour cette image ou cette vidéo, exactement comme il doit apparaître (par exemple Sofia Marques / Northlight Pictures). Il est identique dans toutes les langues.

# ---- Personne -----------------------------------------------------------------------------------
ctmd_person=Personne
ctmd_person_description=Un membre de la rédaction ou un intervenant, avec sa page qui liste ses articles et ses sessions.
ctmd_person.jcr_title=Nom complet
ctmd_person.jcr_title.ui.tooltip=Le nom de la personne tel qu'il s'affiche sur les cartes, les signatures et sa page, par exemple « Mara Lindqvist ».
ctmd_person.role=Fonction
ctmd_person.role.ui.tooltip=Intitulé du poste ou rôle, par exemple « Rédactrice en chef adjointe » ou « Responsable du streaming ».
ctmd_person.organisation=Organisation
ctmd_person.organisation.ui.tooltip=Entreprise ou organisation de la personne, affichée après sa fonction. Laissez vide pour la rédaction.
ctmd_person.sortName=Nom de classement
ctmd_person.sortName.ui.tooltip=Nom sous lequel la personne est classée dans un index de A à Z, en général le nom de famille. Laissez vide pour utiliser le dernier mot du nom complet.
ctmd_person.teaser=Biographie courte
ctmd_person.teaser.ui.tooltip=Une ou deux phrases affichées sur les cartes et utilisées comme description de la page de la personne dans les moteurs de recherche.
ctmd_person.bio=Biographie
ctmd_person.bio.ui.tooltip=Biographie complète affichée sur la page de la personne. Les titres internes commencent au niveau 2.

# ---- Article ------------------------------------------------------------------------------------
ctmd_story=Article
ctmd_story_description=Un article du site éditorial : actualité, dossier, tribune, entretien, rapport, vidéo ou podcast, avec sa propre page.
ctmd_story.format=Format
ctmd_story.format.ui.tooltip=Type d'article. Il s'affiche en étiquette sur les cartes et les pages, permet aux fils de ne garder que certains formats et décide de ce que montre la page (une vidéo, un lecteur audio).
ctmd_story.format.news=Actualité
ctmd_story.format.feature=Dossier
ctmd_story.format.opinion=Tribune
ctmd_story.format.interview=Entretien
ctmd_story.format.report=Rapport
ctmd_story.format.video=Vidéo
ctmd_story.format.podcast=Podcast
ctmd_story.authors=Auteurs
ctmd_story.authors.ui.tooltip=Personnes qui ont écrit l'article, dans l'ordre de la signature. Chaque nom renvoie vers la page de la personne.
ctmd_story.video=Vidéo
ctmd_story.video.ui.tooltip=Pour un article vidéo : une vidéo de la galerie média (interne avec sous-titres, ou externe), affichée en haut de la page. Laissez vide pour les autres formats.
ctmd_story.audio=Fichier audio
ctmd_story.audio.ui.tooltip=Pour un podcast : le fichier audio de l'épisode dans la médiathèque, lu sur la page. Ajoutez toujours sa transcription.
ctmd_story.audioCaptions=Sous-titres de l'audio
ctmd_story.audioCaptions.ui.tooltip=Sous-titres WebVTT de l'épisode dans cette langue (un fichier .vtt de la médiathèque). La page n'affiche le lecteur audio qu'avec des sous-titres ; sans eux, elle propose le fichier à télécharger et la transcription.
ctmd_story.transcript=Transcription
ctmd_story.transcript.ui.tooltip=Texte intégral de l'audio ou de la vidéo, pour les personnes qui ne peuvent pas l'entendre et pour les moteurs de recherche. Affiché sous le lecteur.

# ---- Fil d'articles -----------------------------------------------------------------------------
ctmd_storyFeed=Fil d'articles
ctmd_storyFeed_description=Liste automatiquement des articles, du plus récent au plus ancien : les articles d'un thème, les dernières vidéos, les rapports d'un sujet.
ctmd_storyFeed.jcr_title=Titre
ctmd_storyFeed.jcr_title.ui.tooltip=Titre de la section, par exemple « Le dernier mot sur le streaming ». Facultatif.
ctmd_storyFeed.startNode=Chercher sous
ctmd_storyFeed.startNode.ui.tooltip=Dossier ou page sous lequel chercher les articles. Laissez vide pour lister les articles de tout le site. Un dossier d'un autre site peut être choisi.
ctmd_storyFeed.pageCategories=Articles des thèmes de cette page
ctmd_storyFeed.pageCategories.ui.tooltip=Ne liste que les articles classés dans une des catégories de la page qui affiche le fil, ou une de leurs sous-catégories. À utiliser sur les pages de thème : donnez son thème à la page comme catégorie.
ctmd_storyFeed.filterCategories=Catégories
ctmd_storyFeed.filterCategories.ui.tooltip=Ne liste que les articles d'une de ces catégories, ou d'une de leurs sous-catégories. Laissez vide pour lister les articles de toutes les catégories.
ctmd_storyFeed.formats=Formats
ctmd_storyFeed.formats.ui.tooltip=Ne liste que les articles de ces formats. Laissez vide pour lister tous les formats.
ctmd_storyFeed.formats.news=Actualité
ctmd_storyFeed.formats.feature=Dossier
ctmd_storyFeed.formats.opinion=Tribune
ctmd_storyFeed.formats.interview=Entretien
ctmd_storyFeed.formats.report=Rapport
ctmd_storyFeed.formats.video=Vidéo
ctmd_storyFeed.formats.podcast=Podcast
ctmd_storyFeed.maxItems=Nombre d'articles
ctmd_storyFeed.maxItems.ui.tooltip=Combien des articles les plus récents le fil affiche, de 1 à 50. Ajoutez un bouton « Tout voir » pour renvoyer vers la liste complète.
ctmd_storyFeed.layout=Disposition
ctmd_storyFeed.layout.ui.tooltip=Grille de cartes, liste compacte, ou l'article le plus récent en grand au-dessus d'une grille des autres.
ctmd_storyFeed.layout.grid=Grille de cartes
ctmd_storyFeed.layout.list=Liste compacte
ctmd_storyFeed.layout.lead=Article à la une et grille
ctmd_storyFeed.showFilter=Boutons de format
ctmd_storyFeed.showFilter.ui.tooltip=Ajoute au-dessus des articles des boutons pour n'afficher qu'un format à la fois. Sans JavaScript, tous les articles restent visibles.
ctmd_storyFeed.noResultText=Texte si aucun résultat
ctmd_storyFeed.noResultText.ui.tooltip=Affiché quand aucun article ne correspond. Laissez vide pour masquer toute la section dans ce cas.

# ---- Session ------------------------------------------------------------------------------------
ctmd_session=Session
ctmd_session_description=Une session du programme d'un événement (intervention, table ronde, atelier, pause) avec sa propre page, affichée dans l'agenda.
ctmd_session.jcr_title=Titre
ctmd_session.jcr_title.ui.tooltip=Titre de la session tel qu'il s'affiche dans l'agenda et sur sa page.
ctmd_session.start=Début
ctmd_session.start.ui.tooltip=Jour et heure de début de la session, dans le fuseau horaire de l'événement (défini sur le dossier de l'événement).
ctmd_session.end=Fin
ctmd_session.end.ui.tooltip=Jour et heure de fin de la session, le même jour que son début.
ctmd_session.room=Salle
ctmd_session.room.ui.tooltip=Lieu de la session, par exemple « Scène principale » ou « Salle B2 ».
ctmd_session.stream=Parcours
ctmd_session.stream.ui.tooltip=Parcours du programme auquel appartient la session, par exemple « Conférence » ou « Articles techniques ». L'agenda filtre sur ce champ.
ctmd_session.sessionType=Type
ctmd_session.sessionType.ui.tooltip=Type de session, affiché en étiquette dans l'agenda et sur la page. L'agenda filtre sur ce champ.
ctmd_session.sessionType.keynote=Conférence plénière
ctmd_session.sessionType.talk=Intervention
ctmd_session.sessionType.panel=Table ronde
ctmd_session.sessionType.workshop=Atelier
ctmd_session.sessionType.fireside=Entretien au coin du feu
ctmd_session.sessionType.break=Pause
ctmd_session.teaser=Résumé
ctmd_session.teaser.ui.tooltip=Une ou deux phrases affichées dans l'agenda et utilisées comme description de la page de la session dans les moteurs de recherche.
ctmd_session.body=Description
ctmd_session.body.ui.tooltip=Description complète affichée sur la page de la session. Les titres internes commencent au niveau 2.
ctmd_sessionSpeaker=Intervenant
ctmd_sessionSpeaker_description=Un intervenant d'une session : une personne et son rôle.
ctmd_sessionSpeaker.person=Personne
ctmd_sessionSpeaker.person.ui.tooltip=L'intervenant, choisi parmi les personnes du site. Son nom, sa fonction et son portrait viennent de sa propre page.
ctmd_sessionSpeaker.speakerRole=Rôle
ctmd_sessionSpeaker.speakerRole.ui.tooltip=Le rôle de la personne dans cette session, affiché après son nom.
ctmd_sessionSpeaker.speakerRole.speaker=Intervenant
ctmd_sessionSpeaker.speakerRole.keynote=Conférencier principal
ctmd_sessionSpeaker.speakerRole.moderator=Modérateur
ctmd_sessionSpeaker.speakerRole.panellist=Panéliste
ctmd_sessionSpeaker.speakerRole.host=Animateur

# ---- Agenda -------------------------------------------------------------------------------------
ctmd_agenda=Agenda
ctmd_agenda_description=Le programme d'un événement : un onglet par jour, les sessions dans l'ordre des horaires, avec des filtres.
ctmd_agenda.jcr_title=Titre
ctmd_agenda.jcr_title.ui.tooltip=Titre de la section, par exemple « Programme ». Facultatif.
ctmd_agenda.startNode=Chercher sous
ctmd_agenda.startNode.ui.tooltip=Le dossier de l'événement, qui contient ses sessions. Laissez vide pour lister les sessions de tout le site.
ctmd_agenda.showFilters=Filtres
ctmd_agenda.showFilters.ui.tooltip=Ajoute au-dessus des sessions des filtres par parcours, salle et type. Sans JavaScript, toutes les sessions restent visibles.
ctmd_agenda.noResultText=Texte s'il n'y a aucune session
ctmd_agenda.noResultText.ui.tooltip=Affiché quand le dossier ne contient encore aucune session, par exemple « Le programme sera publié en mai ». Laissez vide pour masquer la section.

# ---- Galerie d'intervenants ---------------------------------------------------------------------
ctmd_speakerGallery=Galerie d'intervenants
ctmd_speakerGallery_description=Cartes avec portrait des personnes d'un dossier, triées par nom, avec un index de A à Z facultatif.
ctmd_speakerGallery.jcr_title=Titre
ctmd_speakerGallery.jcr_title.ui.tooltip=Titre de la section, par exemple « Intervenants ». Facultatif.
ctmd_speakerGallery.startNode=Chercher sous
ctmd_speakerGallery.startNode.ui.tooltip=Dossier qui contient les personnes à afficher, par exemple les intervenants de l'événement. Laissez vide pour afficher toutes les personnes du site.
ctmd_speakerGallery.maxItems=Nombre de personnes
ctmd_speakerGallery.maxItems.ui.tooltip=Nombre maximum de personnes affichées, de 1 à 200, dans l'ordre des noms.
ctmd_speakerGallery.showIndex=Index de A à Z
ctmd_speakerGallery.showIndex.ui.tooltip=Ajoute au-dessus des cartes une ligne de lettres, chacune un lien vers la première personne classée sous cette lettre.
ctmd_speakerGallery.noResultText=Texte si personne n'est listé
ctmd_speakerGallery.noResultText.ui.tooltip=Affiché quand le dossier ne contient encore personne. Laissez vide pour masquer la section.

# ---- Dates clés ---------------------------------------------------------------------------------
ctmd_keyDates=Dates clés
ctmd_keyDates_description=Les dates et le lieu d'un événement, un compte à rebours facultatif et les dates clés qui le précèdent.
ctmd_keyDates.jcr_title=Titre
ctmd_keyDates.jcr_title.ui.tooltip=Titre de la section, par exemple « Orvane Live 2027 ». Facultatif.
ctmd_keyDates.eventStart=Premier jour
ctmd_keyDates.eventStart.ui.tooltip=Premier jour de l'événement.
ctmd_keyDates.eventEnd=Dernier jour
ctmd_keyDates.eventEnd.ui.tooltip=Dernier jour de l'événement. Laissez vide pour un événement d'une journée.
ctmd_keyDates.venue=Lieu
ctmd_keyDates.venue.ui.tooltip=Lieu de l'événement, par exemple « Centre d'exposition du Port, Lisbonne ».
ctmd_keyDates.showCountdown=Compte à rebours
ctmd_keyDates.showCountdown.ui.tooltip=Affiche le nombre de jours avant le premier jour (« Dans 12 jours »), puis « En ce moment » pendant l'événement. Nécessite JavaScript ; rien ne s'affiche sans.
ctmd_keyDate=Date clé
ctmd_keyDate_description=Une date du calendrier d'un événement, comme « Ouverture des inscriptions ».
ctmd_keyDate.jcr_title=Titre
ctmd_keyDate.jcr_title.ui.tooltip=Ce qui se passe ce jour-là, par exemple « Fin du tarif préférentiel ».
ctmd_keyDate.date=Date
ctmd_keyDate.date.ui.tooltip=Le jour de cette date clé.
ctmd_keyDate.detail=Précision
ctmd_keyDate.detail.ui.tooltip=Une courte ligne affichée sous le titre, par exemple « 30 % de réduction sur le pass complet ». Facultatif.

# ---- Résultats de recherche ---------------------------------------------------------------------
ctmd_searchResults=Résultats de recherche
ctmd_searchResults_description=Un champ de recherche avec suggestions, des filtres (thèmes, mots-clés, format, type, site) et les résultats d'Augmented Search, sur cette page.
ctmd_searchResults.jcr_title=Titre
ctmd_searchResults.jcr_title.ui.tooltip=Titre de la section, par exemple « Recherche ». Facultatif.
ctmd_searchResults.scope=Rechercher dans
ctmd_searchResults.scope.ui.tooltip=Ce site seulement, ou ce site et tous les sites vers lesquels pointe sa barre du réseau.
ctmd_searchResults.scope.site=Ce site
ctmd_searchResults.scope.network=Ce site et son réseau
ctmd_searchResults.pageSize=Résultats par page
ctmd_searchResults.pageSize.ui.tooltip=Nombre de résultats par page, de 5 à 50, avec des liens vers les résultats précédents et suivants.
ctmd_searchResults.noResultText=Texte si aucun résultat
ctmd_searchResults.noResultText.ui.tooltip=Affiché quand aucun contenu ne correspond aux mots saisis. Laissez vide pour le texte par défaut.

# ---- Brief --------------------------------------------------------------------------------------
ctmd_brief=Brief
ctmd_brief_description=Ce dont le groupe média a besoin auprès de ses fournisseurs photo et vidéo : la date limite, le type de médias, la quantité, l'usage. Possède sa propre page.
ctmd_brief.jcr_title=Titre
ctmd_brief.jcr_title.ui.tooltip=Nom du brief tel que les fournisseurs le lisent sur les cartes et sur sa page, par exemple « Sommet du streaming : photos du public et de la scène ».
ctmd_brief.description=Description
ctmd_brief.description.ui.tooltip=Ce qui est demandé, avec vos mots : sujets, style, exigences techniques. Affichée sur la page du brief.
ctmd_brief.deadline=Date limite
ctmd_brief.deadline.ui.tooltip=Dernier jour pour envoyer des propositions. Les briefs sont listés avec la date limite la plus proche en premier. Clore un brief est un choix à part (Statut) : une date ne le clôt pas.
ctmd_brief.mediaWanted=Médias demandés
ctmd_brief.mediaWanted.ui.tooltip=Photos, vidéos ou les deux.
ctmd_brief.mediaWanted.photo=Photos
ctmd_brief.mediaWanted.video=Vidéos
ctmd_brief.quantity=Quantité
ctmd_brief.quantity.ui.tooltip=Combien de photos ou de vidéos sont demandées, de 1 à 10000. Laissez vide quand aucun nombre n'est fixé.
ctmd_brief.usage=Usage prévu
ctmd_brief.usage.ui.tooltip=Ce à quoi serviront les médias. Les fournisseurs le voient sur la page du brief.
ctmd_brief.usage.storyIllustration=Illustration d'articles
ctmd_brief.usage.social=Réseaux sociaux
ctmd_brief.usage.eventScreens=Écrans d'événement
ctmd_brief.briefStatus=Statut
ctmd_brief.briefStatus.ui.tooltip=Un brief ouvert est listé et accepte des propositions. Un brief clos quitte les listes qui n'affichent que les briefs ouverts, et sa page indique qu'il n'accepte plus de propositions.
ctmd_brief.briefStatus.open=Ouvert
ctmd_brief.briefStatus.closed=Clos
ctmd_brief.referenceImage=Image d'inspiration
ctmd_brief.referenceImage.ui.tooltip=Une image qui montre le style recherché. Affichée sur la page du brief ; son alternative textuelle est le titre de l'image dans la médiathèque : donnez-lui-en un.
ctmd_brief.submissionForm=Formulaire de proposition
ctmd_brief.submissionForm.ui.tooltip=Le formulaire Formidable avec lequel les fournisseurs répondent à ce brief. Il s'affiche sur la page du brief tant que celui-ci est ouvert ; un brief clos affiche un court avis à la place. Laissez vide pour n'afficher aucun formulaire.

# ---- Proposition --------------------------------------------------------------------------------
ctmd_submission=Proposition
ctmd_submission_description=Ce qu'un fournisseur a envoyé en réponse à un brief : photos ou vidéos avec leur légende, leur crédit et leur licence, et le suivi du service photo. Affichée sous forme de carte de suivi dans la liste des propositions. Pas de page propre.
ctmd_submission.jcr_title=Titre
ctmd_submission.jcr_title.ui.tooltip=Titre de la proposition, affiché sur sa carte de suivi. Il est lu dans la langue où il a été saisi.
ctmd_submission.caption=Légende
ctmd_submission.caption.ui.tooltip=Décrit ce que montrent les images. Saisie une seule fois par le fournisseur, dans une seule langue.
ctmd_submission.credit=Crédit
ctmd_submission.credit.ui.tooltip=Comment les images sont créditées à la publication, par exemple « Mara Lindqvist / Studio Nord ».
ctmd_submission.licence=Licence
ctmd_submission.licence.ui.tooltip=Ce que le fournisseur autorise : usage éditorial sur tous les sites du groupe, ou exclusivité pour le groupe pendant 30 jours.
ctmd_submission.licence.editorial=Usage éditorial sur tous les sites du groupe
ctmd_submission.licence.exclusive30=Exclusivité de 30 jours
ctmd_submission.shotDate=Date de prise de vue
ctmd_submission.shotDate.ui.tooltip=Le jour où les images ont été prises.
ctmd_submission.location=Lieu
ctmd_submission.location.ui.tooltip=Où les images ont été prises, avec les mots du fournisseur.
ctmd_submission.media=Photos et vidéos
ctmd_submission.media.ui.tooltip=Les fichiers photo et vidéo de la proposition, depuis la médiathèque. La carte de suivi affiche de petites vignettes des premières photos.
ctmd_submission.captionsFiles=Fichiers de sous-titres
ctmd_submission.captionsFiles.ui.tooltip=Fichiers WebVTT (.vtt) qui sous-titrent les vidéos.
ctmd_submission.brief=Brief
ctmd_submission.brief.ui.tooltip=Le brief auquel répond la proposition. La carte de suivi le relie, pour les visiteurs qui peuvent le lire.
ctmd_submission.submissionStatus=Statut
ctmd_submission.submissionStatus.ui.tooltip=Où en est la proposition. Le fournisseur le lit sur la carte de suivi, en texte accompagné d'un symbole.
ctmd_submission.submissionStatus.submitted=Envoyée
ctmd_submission.submissionStatus.inReview=En cours d'examen
ctmd_submission.submissionStatus.accepted=Acceptée
ctmd_submission.submissionStatus.declined=Refusée
ctmd_submission.deskNote=Note du service photo
ctmd_submission.deskNote.ui.tooltip=Une note du service photo au fournisseur, par exemple le motif d'un refus. Affichée sur la carte de suivi ; publiée comme le reste de la proposition.
ctmd_submission.usedIn=Utilisée dans
ctmd_submission.usedIn.ui.tooltip=Le contenu publié, par exemple un article, qui utilise les médias acceptés. La carte de suivi le relie pour une proposition acceptée.
ctmd_submission.company=Société
ctmd_submission.company.ui.tooltip=La société du fournisseur. Renseignée quand le fournisseur envoie la proposition.
ctmd_submission.submittedBy=Envoyée par
ctmd_submission.submittedBy.ui.tooltip=L'utilisateur qui a envoyé la proposition. Renseigné quand le fournisseur l'envoie.

# ---- Liste de briefs ----------------------------------------------------------------------------
ctmd_briefList=Liste de briefs
ctmd_briefList_description=Liste les briefs que le visiteur peut lire, la date limite la plus proche en premier. Deux visiteurs peuvent voir deux listes différentes.
ctmd_briefList.jcr_title=Titre
ctmd_briefList.jcr_title.ui.tooltip=Titre de la section, par exemple « Briefs ouverts ». Facultatif.
ctmd_briefList.folder=Chercher sous
ctmd_briefList.folder.ui.tooltip=Dossier de contenu (ou tout autre nœud) sous lequel chercher les briefs. Laissez vide pour chercher dans tout le site. Les briefs que le visiteur ne peut pas lire sont écartés.
ctmd_briefList.showClosed=Afficher les briefs clos
ctmd_briefList.showClosed.ui.tooltip=Désactivé : seuls les briefs ouverts sont listés. Activé : les briefs clos le sont aussi, avec la mention « Clos ».
ctmd_briefList.maxItems=Nombre de briefs
ctmd_briefList.maxItems.ui.tooltip=Combien de briefs la liste affiche au plus, de 1 à 100. Ajoutez un bouton « Tout voir » pour renvoyer vers une liste plus complète.
ctmd_briefList.emptyText=Texte quand rien n'est listé
ctmd_briefList.emptyText.ui.tooltip=Affiché quand le visiteur n'a aucun brief à lire. Laissez vide pour masquer toute la section dans ce cas.

# ---- Liste de propositions ----------------------------------------------------------------------
ctmd_submissionList=Liste de propositions
ctmd_submissionList_description=Liste les propositions que le visiteur peut lire, les plus récentes d'abord, sous forme de cartes de suivi. Un fournisseur voit les siennes.
ctmd_submissionList.jcr_title=Titre
ctmd_submissionList.jcr_title.ui.tooltip=Titre de la section, par exemple « Mes propositions ». Facultatif.
ctmd_submissionList.folder=Chercher sous
ctmd_submissionList.folder.ui.tooltip=Dossier de contenu (ou tout autre nœud) sous lequel chercher les propositions. Laissez vide pour chercher dans tout le site. Les propositions que le visiteur ne peut pas lire sont écartées.
ctmd_submissionList.maxItems=Nombre de propositions
ctmd_submissionList.maxItems.ui.tooltip=Combien des propositions les plus récentes la liste affiche, de 1 à 100. Ajoutez un bouton « Tout voir » pour renvoyer vers une liste plus complète.
ctmd_submissionList.emptyText=Texte quand rien n'est listé
ctmd_submissionList.emptyText.ui.tooltip=Affiché quand le visiteur n'a aucune proposition à lire. Laissez vide pour masquer toute la section dans ce cas.
