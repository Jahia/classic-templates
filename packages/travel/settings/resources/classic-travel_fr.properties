# Libellés de l'éditeur pour classic-travel. Les clés sont dérivées du type DÉCLARANT (les champs
# d'un mixin sont rattachés au mixin), ':' devient '_', les valeurs de liste de choix sont
# <type>.<propriété>.<valeur>, et l'aide d'un type est <type>_description. Les champs hérités des
# mixins de classic-templates (ctplmix:media, ctplmix:cta, ctplmix:sectionStyle) gardent leurs
# libellés classic-templates.

# ---- Niveaux de composants ----------------------------------------------------------------------
ctrvmix_component=Voyage
ctrvmix_component_description=Destinations, offres tarifaires et sections de voyage du module classic-travel.
ctrvmix_pageComponent=Section voyage
ctrvmix_pageComponent_description=Une section de voyage que l'on peut placer dans les zones des pages classic-templates.

# ---- Prix (commun aux destinations et aux offres) -----------------------------------------------
ctrvmix_price=Prix
ctrvmix_price.price=Prix à partir de
ctrvmix_price.price.ui.tooltip=Prix le plus bas, affiché sous la forme « À partir de 1 280 HKD ». Saisissez le montant seul, sans la devise. Laissez vide pour n'afficher aucun prix.
ctrvmix_price.currency=Devise
ctrvmix_price.currency.ui.tooltip=Devise du prix. Les visiteurs voient son code (HKD) ; les lecteurs d'écran lisent son nom (dollars de Hong Kong).
ctrvmix_price.currency.USD=USD, dollar américain
ctrvmix_price.currency.EUR=EUR, euro
ctrvmix_price.currency.GBP=GBP, livre sterling
ctrvmix_price.currency.HKD=HKD, dollar de Hong Kong
ctrvmix_price.currency.CNY=CNY, yuan chinois
ctrvmix_price.currency.JPY=JPY, yen japonais
ctrvmix_price.currency.KRW=KRW, won sud-coréen
ctrvmix_price.currency.SGD=SGD, dollar de Singapour
ctrvmix_price.currency.THB=THB, baht thaïlandais
ctrvmix_price.currency.AUD=AUD, dollar australien
ctrvmix_price.currency.NZD=NZD, dollar néo-zélandais
ctrvmix_price.currency.CAD=CAD, dollar canadien
ctrvmix_price.currency.CHF=CHF, franc suisse
ctrvmix_price.priceNote=Précision sur le prix
ctrvmix_price.priceNote.ui.tooltip=Ce que couvre le prix, affiché en dessous, par exemple « Aller simple, classe économique, taxes incluses ». Restez bref : les conditions détaillées vont dans les conditions tarifaires.

# ---- Listes de voyage (communes à la liste d'offres et à la grille de destinations) -------------
ctrvmix_travelList=Réglages de la liste
ctrvmix_travelList.startNode=Chercher sous
ctrvmix_travelList.startNode.ui.tooltip=Dossier ou page sous lequel chercher les contenus. Laissez vide pour lister les contenus de tout le site.
ctrvmix_travelList.region=Région
ctrvmix_travelList.region.ui.tooltip=Ne lister que les destinations de cette région (pour une offre, la région de sa destination). « Toutes les régions » liste tout.
ctrvmix_travelList.region.all=Toutes les régions
ctrvmix_travelList.region.greaterChina=Grande Chine
ctrvmix_travelList.region.japanKorea=Japon et Corée
ctrvmix_travelList.region.southeastAsia=Asie du Sud-Est
ctrvmix_travelList.region.southAsia=Asie du Sud
ctrvmix_travelList.region.oceania=Océanie
ctrvmix_travelList.region.europe=Europe
ctrvmix_travelList.region.northAmerica=Amérique du Nord
ctrvmix_travelList.region.other=Autres régions
ctrvmix_travelList.maxItems=Nombre d'éléments
ctrvmix_travelList.maxItems.ui.tooltip=Nombre maximal d'éléments affichés, de 1 à 50. Utilisez le lien « voir tout » pour mener les visiteurs vers la liste complète.
ctrvmix_travelList.noResultText=Texte si vide
ctrvmix_travelList.noResultText.ui.tooltip=Texte affiché quand il n'y a rien à lister. Laissez vide pour masquer la section dans ce cas.

# ---- Destination --------------------------------------------------------------------------------
ctrv_destination=Destination
ctrv_destination_description=Une destination desservie par la compagnie, avec sa description, l'essentiel à savoir et son prix « à partir de ». Elle a sa propre page et apparaît dans les grilles de destinations et les listes de contenus.
ctrv_destination.jcr_title=Ville
ctrv_destination.jcr_title.ui.tooltip=Nom de la ville, par exemple « Tokyo ». C'est le titre de la page de la destination et de ses cartes.
ctrv_destination.airportCode=Code aéroport
ctrv_destination.airportCode.ui.tooltip=Code IATA de l'aéroport ou de la ville, trois lettres majuscules, par exemple « NRT ».
ctrv_destination.country=Pays
ctrv_destination.country.ui.tooltip=Pays de la destination, tel qu'il est affiché aux visiteurs, par exemple « Japon ».
ctrv_destination.region=Région
ctrv_destination.region.ui.tooltip=Région de la destination, utilisée par le filtre par région des listes d'offres et des grilles de destinations.
ctrv_destination.region.greaterChina=Grande Chine
ctrv_destination.region.japanKorea=Japon et Corée
ctrv_destination.region.southeastAsia=Asie du Sud-Est
ctrv_destination.region.southAsia=Asie du Sud
ctrv_destination.region.oceania=Océanie
ctrv_destination.region.europe=Europe
ctrv_destination.region.northAmerica=Amérique du Nord
ctrv_destination.region.other=Autres régions
ctrv_destination.teaser=Accroche
ctrv_destination.teaser.ui.tooltip=Une ou deux phrases affichées sur les cartes de la destination et sous son titre. C'est aussi la description affichée par les moteurs de recherche.
ctrv_destination.body=Description
ctrv_destination.body.ui.tooltip=Description complète de la destination, affichée sur sa page. Commencez vos intertitres au premier niveau proposé : ils sont placés sous le titre de la page.
ctrv_destination.localCurrency=Monnaie locale
ctrv_destination.localCurrency.ui.tooltip=Monnaie utilisée sur place, telle qu'elle est affichée aux visiteurs, par exemple « Yen japonais (JPY) ».
ctrv_destination.language=Langue
ctrv_destination.language.ui.tooltip=Langue ou langues parlées sur place, par exemple « Japonais ».
ctrv_destination.timeZone=Fuseau horaire
ctrv_destination.timeZone.ui.tooltip=Fuseau horaire de la destination, par exemple « UTC+9, une heure de plus qu'à Hong Kong ».
ctrv_destination.voltage=Électricité
ctrv_destination.voltage.ui.tooltip=Tension et prises, par exemple « 100 V, prises de type A et B ».
ctrv_destination.diallingCode=Indicatif téléphonique
ctrv_destination.diallingCode.ui.tooltip=Indicatif téléphonique international du pays, par exemple « +81 ».
ctrv_destination.relatedDestinations=Destinations associées
ctrv_destination.relatedDestinations.ui.tooltip=Autres destinations proposées en bas de la page de cette destination, sous forme de cartes.
ctrv_destination.latitude=Latitude
ctrv_destination.latitude.ui.tooltip=Latitude de la destination en degrés décimaux, de -90 à 90 (Tokyo : 35,68). Avec la longitude, elle affiche la météo en direct sur la mosaïque de destinations et indique aux moteurs de recherche où se trouve la destination.
ctrv_destination.longitude=Longitude
ctrv_destination.longitude.ui.tooltip=Longitude de la destination en degrés décimaux, de -180 à 180 (Tokyo : 139,69). Laissez les deux vides pour n'afficher aucune météo.

# ---- Offre tarifaire ----------------------------------------------------------------------------
ctrv_fareOffer=Offre tarifaire
ctrv_fareOffer_description=Un tarif vers une destination, avec son prix, sa période de voyage, sa fin de vente et ses conditions. Il a sa propre page et apparaît dans les listes d'offres et les listes de contenus.
ctrv_fareOffer.jcr_title=Nom de l'offre
ctrv_fareOffer.jcr_title.ui.tooltip=Nom de l'offre, utilisé comme titre de sa page, par exemple « Tokyo en économique au départ de Hong Kong ». Les cartes affichent à la place la ville de destination.
ctrv_fareOffer.destination=Destination
ctrv_fareOffer.destination.ui.tooltip=La destination de ce tarif. Les cartes affichent sa ville et son image, et les listes d'offres filtrent sur sa région.
ctrv_fareOffer.origin=Ville de départ
ctrv_fareOffer.origin.ui.tooltip=Ville de départ du tarif, telle qu'elle est affichée aux visiteurs, par exemple « Hong Kong ».
ctrv_fareOffer.cabin=Cabine
ctrv_fareOffer.cabin.ui.tooltip=Classe de voyage du tarif.
ctrv_fareOffer.cabin.economy=Économique
ctrv_fareOffer.cabin.premiumEconomy=Économique premium
ctrv_fareOffer.cabin.business=Affaires
ctrv_fareOffer.travelFrom=Voyage à partir du
ctrv_fareOffer.travelFrom.ui.tooltip=Premier jour de la période de voyage du tarif.
ctrv_fareOffer.travelTo=Voyage jusqu'au
ctrv_fareOffer.travelTo.ui.tooltip=Dernier jour de la période de voyage du tarif.
ctrv_fareOffer.saleEnds=Fin de la vente
ctrv_fareOffer.saleEnds.ui.tooltip=Dernier jour où le tarif peut être réservé. Le lendemain, l'offre sort des listes d'offres et sa page indique que la vente est terminée.
ctrv_fareOffer.conditions=Conditions tarifaires
ctrv_fareOffer.conditions.ui.tooltip=Conditions du tarif (bagages, modifications, remboursements), affichées sur la page de l'offre. Commencez vos intertitres au premier niveau proposé.

# ---- Liste d'offres -----------------------------------------------------------------------------
ctrv_fareList=Liste d'offres
ctrv_fareList_description=Une section qui liste automatiquement des offres tarifaires, avec un titre facultatif et un lien « voir tout ».
ctrv_fareList.sort=Trier par
ctrv_fareList.sort.ui.tooltip=Ordre des offres : la moins chère d'abord, la vente qui se termine le plus tôt d'abord, ou par destination de A à Z.
ctrv_fareList.sort.priceAsc=Prix, le moins cher d'abord
ctrv_fareList.sort.saleEndsAsc=Fin de la vente, la plus proche d'abord
ctrv_fareList.sort.destinationAsc=Destination, de A à Z

# ---- Grille de destinations ---------------------------------------------------------------------
ctrv_destinationGrid=Grille de destinations
ctrv_destinationGrid_description=Une section qui liste automatiquement des destinations de A à Z, avec leur prix « à partir de », un titre facultatif et un lien « voir tout ».

# ---- Mosaïque de destinations -------------------------------------------------------------------
ctrv_mosaic=Mosaïque de destinations
ctrv_mosaic_description=Une section d'une à quatre destinations choisies, présentées en mosaïque de cartes, avec un titre facultatif.
ctrv_mosaic.destinations=Destinations
ctrv_mosaic.destinations.ui.tooltip=Destinations à afficher, dans l'ordre choisi. Les quatre premières sont affichées ; choisissez-en au moins une. Une destination supprimée ou pas encore publiée est ignorée.

# ---- Outils de voyage ---------------------------------------------------------------------------
ctrv_travelTools=Outils de voyage
ctrv_travelTools_description=Une section d'outils de voyage (réserver, gérer une réservation, s'enregistrer) présentés en onglets, avec un avis affiché à tous les visiteurs.
ctrv_travelTools.notice=Avis
ctrv_travelTools.notice.ui.tooltip=Texte affiché au-dessus des outils pour tous les visiteurs, par exemple « Ce site est une démonstration : aucune réservation n'est effectuée ».
ctrv_travelTool=Outil de voyage
ctrv_travelTool_description=Un outil d'une section d'outils de voyage : son libellé d'onglet, son texte et son lien.
ctrv_travelTool.jcr_title=Libellé de l'onglet
ctrv_travelTool.jcr_title.ui.tooltip=Nom de l'outil, affiché sur son onglet et comme intertitre, par exemple « Réserver un vol ». Restez bref.
ctrv_travelTool.text=Texte
ctrv_travelTool.text.ui.tooltip=Ce que fait l'outil et ce que le visiteur doit savoir avant de l'utiliser.
ctrv_travelTool.icon=Icône
ctrv_travelTool.icon.ui.tooltip=Petite image facultative affichée avant l'intertitre de l'outil. Elle est décorative : les lecteurs d'écran l'ignorent.
