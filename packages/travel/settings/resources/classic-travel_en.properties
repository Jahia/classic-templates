# Editor labels for classic-travel. Keys are derived from the DECLARING type (a mixin's fields are
# keyed on the mixin), ':' becomes '_', choicelist values are <type>.<property>.<value>, and a
# type's help text is <type>_description. Fields inherited from classic-templates mixins
# (ctplmix:media, ctplmix:cta, ctplmix:sectionStyle) keep the classic-templates labels.

# ---- Component tiers ----------------------------------------------------------------------------
ctrvmix_component=Travel
ctrvmix_component_description=Destinations, fare offers and travel sections of the classic-travel module.
ctrvmix_pageComponent=Travel section
ctrvmix_pageComponent_description=A travel section that can be placed in the page areas of classic-templates.

# ---- Price (shared by destinations and fare offers) ---------------------------------------------
ctrvmix_price=Price
ctrvmix_price.price=Price from
ctrvmix_price.price.ui.tooltip=Lowest price, shown as "From HKD 1,280". Write the amount only, without the currency. Leave empty to show no price.
ctrvmix_price.currency=Currency
ctrvmix_price.currency.ui.tooltip=Currency of the price. Visitors see its code (HKD); screen readers read its name (Hong Kong dollars).
ctrvmix_price.currency.USD=USD, US dollar
ctrvmix_price.currency.EUR=EUR, euro
ctrvmix_price.currency.GBP=GBP, pound sterling
ctrvmix_price.currency.HKD=HKD, Hong Kong dollar
ctrvmix_price.currency.CNY=CNY, Chinese yuan
ctrvmix_price.currency.JPY=JPY, Japanese yen
ctrvmix_price.currency.KRW=KRW, South Korean won
ctrvmix_price.currency.SGD=SGD, Singapore dollar
ctrvmix_price.currency.THB=THB, Thai baht
ctrvmix_price.currency.AUD=AUD, Australian dollar
ctrvmix_price.currency.NZD=NZD, New Zealand dollar
ctrvmix_price.currency.CAD=CAD, Canadian dollar
ctrvmix_price.currency.CHF=CHF, Swiss franc
ctrvmix_price.priceNote=Price note
ctrvmix_price.priceNote.ui.tooltip=What the price covers, shown under it, for example "One way, economy, taxes included". Keep it short; long conditions go in the fare conditions.

# ---- Travel lists (shared by the fare list and the destination grid) ------------------------------
ctrvmix_travelList=List settings
ctrvmix_travelList.startNode=Look under
ctrvmix_travelList.startNode.ui.tooltip=Folder or page under which to look for content. Leave empty to list content from the whole site.
ctrvmix_travelList.region=Region
ctrvmix_travelList.region.ui.tooltip=Only list destinations of this region (for a fare offer, the region of its destination). "All regions" lists everything.
ctrvmix_travelList.region.all=All regions
ctrvmix_travelList.region.greaterChina=Greater China
ctrvmix_travelList.region.japanKorea=Japan and Korea
ctrvmix_travelList.region.southeastAsia=Southeast Asia
ctrvmix_travelList.region.southAsia=South Asia
ctrvmix_travelList.region.oceania=Oceania
ctrvmix_travelList.region.europe=Europe
ctrvmix_travelList.region.northAmerica=North America
ctrvmix_travelList.region.other=Other regions
ctrvmix_travelList.maxItems=Number of items
ctrvmix_travelList.maxItems.ui.tooltip=Maximum number of items shown, from 1 to 50. Use the "see all" link to lead visitors to the full list.
ctrvmix_travelList.noResultText=Text when empty
ctrvmix_travelList.noResultText.ui.tooltip=Text shown when there is nothing to list. Leave empty to hide the section in that case.

# ---- Destination --------------------------------------------------------------------------------
ctrv_destination=Destination
ctrv_destination_description=A destination served by the airline, with its description, key facts and "from" price. It has its own page and appears in destination grids and content lists.
ctrv_destination.jcr_title=City
ctrv_destination.jcr_title.ui.tooltip=Name of the city, for example "Tokyo". It is the title of the destination's page and of its cards.
ctrv_destination.airportCode=Airport code
ctrv_destination.airportCode.ui.tooltip=IATA code of the airport or of the city, three capital letters, for example "NRT".
ctrv_destination.country=Country
ctrv_destination.country.ui.tooltip=Country of the destination, as shown to visitors, for example "Japan".
ctrv_destination.region=Region
ctrv_destination.region.ui.tooltip=Region of the destination, used by the region filter of fare lists and destination grids.
ctrv_destination.region.greaterChina=Greater China
ctrv_destination.region.japanKorea=Japan and Korea
ctrv_destination.region.southeastAsia=Southeast Asia
ctrv_destination.region.southAsia=South Asia
ctrv_destination.region.oceania=Oceania
ctrv_destination.region.europe=Europe
ctrv_destination.region.northAmerica=North America
ctrv_destination.region.other=Other regions
ctrv_destination.teaser=Teaser
ctrv_destination.teaser.ui.tooltip=One or two sentences shown on the destination's cards and under its title. It is also the description search engines show.
ctrv_destination.body=Description
ctrv_destination.body.ui.tooltip=Full description of the destination, shown on its page. Start your headings at the first level offered: they are placed under the page title.
ctrv_destination.localCurrency=Local currency
ctrv_destination.localCurrency.ui.tooltip=Currency used at the destination, as shown to visitors, for example "Japanese yen (JPY)".
ctrv_destination.language=Language
ctrv_destination.language.ui.tooltip=Language or languages spoken at the destination, for example "Japanese".
ctrv_destination.timeZone=Time zone
ctrv_destination.timeZone.ui.tooltip=Time zone of the destination, for example "UTC+9, one hour ahead of Hong Kong".
ctrv_destination.voltage=Electricity
ctrv_destination.voltage.ui.tooltip=Voltage and plugs, for example "100 V, plugs of type A and B".
ctrv_destination.diallingCode=Dialling code
ctrv_destination.diallingCode.ui.tooltip=International dialling code of the country, for example "+81".
ctrv_destination.relatedDestinations=Related destinations
ctrv_destination.relatedDestinations.ui.tooltip=Other destinations suggested at the bottom of this destination's page, as cards.
ctrv_destination.latitude=Latitude
ctrv_destination.latitude.ui.tooltip=Latitude of the destination in decimal degrees, from -90 to 90 (Tokyo: 35.68). With the longitude, it shows the live weather on the destination mosaic and tells search engines where the destination is.
ctrv_destination.longitude=Longitude
ctrv_destination.longitude.ui.tooltip=Longitude of the destination in decimal degrees, from -180 to 180 (Tokyo: 139.69). Leave both empty to show no weather.

# ---- Fare offer ---------------------------------------------------------------------------------
ctrv_fareOffer=Fare offer
ctrv_fareOffer_description=A fare to one destination, with its price, travel period, end of sale and conditions. It has its own page and appears in fare lists and content lists.
ctrv_fareOffer.jcr_title=Offer name
ctrv_fareOffer.jcr_title.ui.tooltip=Name of the offer, used as the title of its page, for example "Tokyo in economy from Hong Kong". Cards show the destination's city instead.
ctrv_fareOffer.destination=Destination
ctrv_fareOffer.destination.ui.tooltip=The destination this fare flies to. Cards show its city and image, and fare lists filter on its region.
ctrv_fareOffer.origin=Departure city
ctrv_fareOffer.origin.ui.tooltip=City the fare departs from, as shown to visitors, for example "Hong Kong".
ctrv_fareOffer.cabin=Cabin
ctrv_fareOffer.cabin.ui.tooltip=Travel class of the fare.
ctrv_fareOffer.cabin.economy=Economy
ctrv_fareOffer.cabin.premiumEconomy=Premium economy
ctrv_fareOffer.cabin.business=Business
ctrv_fareOffer.travelFrom=Travel from
ctrv_fareOffer.travelFrom.ui.tooltip=First day of the travel period of the fare.
ctrv_fareOffer.travelTo=Travel until
ctrv_fareOffer.travelTo.ui.tooltip=Last day of the travel period of the fare.
ctrv_fareOffer.saleEnds=Sale ends
ctrv_fareOffer.saleEnds.ui.tooltip=Last day the fare can be booked. The day after, the offer leaves the fare lists and its page says the sale has ended.
ctrv_fareOffer.conditions=Fare conditions
ctrv_fareOffer.conditions.ui.tooltip=Conditions of the fare (baggage, changes, refunds), shown on the offer's page. Start your headings at the first level offered.

# ---- Fare list ----------------------------------------------------------------------------------
ctrv_fareList=Fare list
ctrv_fareList_description=A section that lists fare offers automatically, with an optional title and a "see all" link.
ctrv_fareList.sort=Sort by
ctrv_fareList.sort.ui.tooltip=Order of the offers: cheapest first, sale ending soonest first, or by destination from A to Z.
ctrv_fareList.sort.priceAsc=Price, cheapest first
ctrv_fareList.sort.saleEndsAsc=End of sale, soonest first
ctrv_fareList.sort.destinationAsc=Destination, A to Z

# ---- Destination grid ---------------------------------------------------------------------------
ctrv_destinationGrid=Destination grid
ctrv_destinationGrid_description=A section that lists destinations automatically from A to Z, with their "from" price, an optional title and a "see all" link.

# ---- Destination mosaic -------------------------------------------------------------------------
ctrv_mosaic=Destination mosaic
ctrv_mosaic_description=A section of one to four destinations you pick, shown as a mosaic of cards, with an optional title.
ctrv_mosaic.destinations=Destinations
ctrv_mosaic.destinations.ui.tooltip=Destinations to show, in the order picked. The first four are shown; pick at least one. A destination that is deleted or not yet published is left out.

# ---- Travel tools -------------------------------------------------------------------------------
ctrv_travelTools=Travel tools
ctrv_travelTools_description=A section of travel tools (book, manage a booking, check in) shown as tabs, with a notice shown to every visitor.
ctrv_travelTools.notice=Notice
ctrv_travelTools.notice.ui.tooltip=Text shown above the tools to every visitor, for example "This is a demonstration site: no booking is made".
ctrv_travelTool=Travel tool
ctrv_travelTool_description=One tool of a travel tools section: its tab label, text and link.
ctrv_travelTool.jcr_title=Tab label
ctrv_travelTool.jcr_title.ui.tooltip=Name of the tool, shown on its tab and as its heading, for example "Book a flight". Keep it short.
ctrv_travelTool.text=Text
ctrv_travelTool.text.ui.tooltip=What the tool does and what the visitor should know before using it.
ctrv_travelTool.icon=Icon
ctrv_travelTool.icon.ui.tooltip=Optional small image shown before the tool's heading. It is decorative: screen readers skip it.
