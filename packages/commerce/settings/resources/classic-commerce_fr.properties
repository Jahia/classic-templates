# Libell\u00e9s \u00e9diteur de classic-commerce (voir classic-commerce.properties pour les r\u00e8gles de cl\u00e9s).
ctcmmix_component=Commerce
ctcmmix_component_description=Sections produits et achat du module classic-commerce.
ctcmmix_pageComponent=Section commerce
ctcmmix_pageComponent_description=Une section d\u2019achat \u00e0 placer dans les zones des pages classic-templates.
ctcmmix_pickedProducts=Produits
ctcmmix_pickedProducts.products=Produits
ctcmmix_pickedProducts.products.ui.tooltip=<b>Produits</b> : choisissez des produits dans le dossier de la boutique (Dossiers de contenu > boutique). Ils s\u2019affichent dans cet ordre, avec leur prix actuel.
ctcm_productCarousel=Carrousel de produits
ctcm_productCarousel_description=Une rang\u00e9e de produits qui d\u00e9file : choisis \u00e0 la main, ou lus dans une boutique et filtr\u00e9s par un tag Shopify.
ctcm_productCarousel.shop=Boutique
ctcm_productCarousel.shop.ui.tooltip=<b>Boutique</b> : le dossier de la boutique o\u00f9 lire les produits, utilis\u00e9 seulement si aucun produit n\u2019est choisi.
ctcm_productCarousel.shopifyTag=Tag Shopify
ctcm_productCarousel.shopifyTag.ui.tooltip=<b>Tag Shopify</b> : ne garder que les produits qui portent ce tag dans Shopify (par exemple <i>bestseller</i> ou <i>new</i>). Vide : tous les produits de la boutique.
ctcm_productCarousel.maxItems=Nombre de produits
ctcm_productCarousel.maxItems.ui.tooltip=<b>Nombre de produits</b> : au plus ce nombre de produits, de 1 \u00e0 24.
ctcm_productCarousel.noResultText=Texte si vide
ctcm_productCarousel.noResultText.ui.tooltip=<b>Texte si vide</b> : affich\u00e9 quand aucun produit ne correspond. Vide : la section est masqu\u00e9e sur le site en ligne.
ctcm_brandSpotlight=Marque \u00e0 la une
ctcm_brandSpotlight_description=Une marque avec sa photo, un court texte, un lien et quelques-uns de ses produits.
ctcm_brandSpotlight.eyebrow=Surtitre
ctcm_brandSpotlight.eyebrow.ui.tooltip=<b>Surtitre</b> : la courte ligne au-dessus du nom de la marque, par exemple <i>Marque de la semaine</i>.
ctcm_brandSpotlight.text=Texte
ctcm_brandSpotlight.text.ui.tooltip=<b>Texte</b> : deux ou trois phrases sur la marque.
ctcm_giftOffer=Offre cadeau
ctcm_giftOffer_description=Un cadeau pour un achat : le cadeau, le montant \u00e0 d\u00e9penser, les conditions et la date de fin.
ctcm_giftOffer.gift=Cadeau
ctcm_giftOffer.gift.ui.tooltip=<b>Cadeau</b> : ce que le client re\u00e7oit, par exemple <i>Une trousse de voyage et deux miniatures</i>.
ctcm_giftOffer.threshold=Montant
ctcm_giftOffer.threshold.ui.tooltip=<b>Montant</b> : la somme \u00e0 d\u00e9penser pour recevoir le cadeau, sans la devise. Vide : aucun montant n\u2019est affich\u00e9.
ctcm_giftOffer.currency=Devise
ctcm_giftOffer.currency.ui.tooltip=<b>Devise</b> : la devise du montant. Les visiteurs voient son code (AED) ; les lecteurs d\u2019\u00e9cran lisent son nom.
ctcm_giftOffer.currency.AED=AED, dirham des \u00c9mirats
ctcm_giftOffer.currency.SAR=SAR, riyal saoudien
ctcm_giftOffer.currency.EGP=EGP, livre \u00e9gyptienne
ctcm_giftOffer.currency.KWD=KWD, dinar kowe\u00eftien
ctcm_giftOffer.currency.QAR=QAR, riyal qatarien
ctcm_giftOffer.currency.BHD=BHD, dinar bahre\u00efni
ctcm_giftOffer.currency.OMR=OMR, rial omanais
ctcm_giftOffer.currency.USD=USD, dollar am\u00e9ricain
ctcm_giftOffer.currency.EUR=EUR, euro
ctcm_giftOffer.currency.GBP=GBP, livre sterling
ctcm_giftOffer.conditions=Conditions
ctcm_giftOffer.conditions.ui.tooltip=<b>Conditions</b> : les mentions, par exemple <i>Dans la limite des stocks, un cadeau par commande</i>.
ctcm_giftOffer.endsOn=Dernier jour
ctcm_giftOffer.endsOn.ui.tooltip=<b>Dernier jour</b> : le dernier jour de l\u2019offre. Elle quitte le site en ligne le lendemain. Vide : elle reste jusqu\u2019\u00e0 ce que vous la retiriez.
ctcm_shopTheLook=Shopper le look
ctcm_shopTheLook_description=Un look avec sa photo et les produits utilis\u00e9s, dans l\u2019ordre.
ctcm_shopTheLook.intro=Introduction
ctcm_shopTheLook.intro.ui.tooltip=<b>Introduction</b> : une ou deux phrases sur le look.
