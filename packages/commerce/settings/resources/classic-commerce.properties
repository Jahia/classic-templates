# Editor labels for classic-commerce. Keys come from the DECLARING type (a mixin's fields are keyed on
# the mixin), ':' becomes '_', choicelist values are <type>.<property>.<value>, and a type's help text
# is <type>_description. Fields inherited from classic-templates mixins keep its labels.
ctcmmix_component=Commerce
ctcmmix_component_description=Product and shopping sections of the classic-commerce module.
ctcmmix_pageComponent=Commerce section
ctcmmix_pageComponent_description=A shopping section that can be placed in the page areas of classic-templates.
ctcmmix_pickedProducts=Products
ctcmmix_pickedProducts.products=Products
ctcmmix_pickedProducts.products.ui.tooltip=<b>Products</b>: pick products from the shop folder (Content folders > shop). They are shown in this order, with their current price from the shop.
ctcm_productCarousel=Product carousel
ctcm_productCarousel_description=A row of products that scrolls sideways: picked by hand, or read from a shop and filtered by a Shopify tag.
ctcm_productCarousel.shop=Shop
ctcm_productCarousel.shop.ui.tooltip=<b>Shop</b>: the shop folder to read products from, used only when no product is picked above.
ctcm_productCarousel.shopifyTag=Shopify tag
ctcm_productCarousel.shopifyTag.ui.tooltip=<b>Shopify tag</b>: keep only the products that carry this tag in Shopify (for example <i>bestseller</i> or <i>new</i>). Empty: every product of the shop.
ctcm_productCarousel.maxItems=Number of products
ctcm_productCarousel.maxItems.ui.tooltip=<b>Number of products</b>: at most this many products, from 1 to 24.
ctcm_productCarousel.noResultText=Text when empty
ctcm_productCarousel.noResultText.ui.tooltip=<b>Text when empty</b>: shown when no product matches. Empty: the section is hidden on the live site.
ctcm_brandSpotlight=Brand spotlight
ctcm_brandSpotlight_description=One brand with its picture, a short text, a link and a few of its products.
ctcm_brandSpotlight.eyebrow=Eyebrow
ctcm_brandSpotlight.eyebrow.ui.tooltip=<b>Eyebrow</b>: the short line above the brand name, for example <i>Brand of the week</i>.
ctcm_brandSpotlight.text=Text
ctcm_brandSpotlight.text.ui.tooltip=<b>Text</b>: two or three sentences about the brand.
ctcm_giftOffer=Gift offer
ctcm_giftOffer_description=A gift with purchase: the gift, the spend that earns it, the conditions and the end date.
ctcm_giftOffer.gift=Gift
ctcm_giftOffer.gift.ui.tooltip=<b>Gift</b>: what the customer receives, for example <i>A travel pouch and two minis</i>.
ctcm_giftOffer.threshold=Spend
ctcm_giftOffer.threshold.ui.tooltip=<b>Spend</b>: the amount to spend to receive the gift, without the currency. Empty: no amount is shown.
ctcm_giftOffer.currency=Currency
ctcm_giftOffer.currency.ui.tooltip=<b>Currency</b>: the currency of the spend. Visitors see its code (AED); screen readers read its name.
ctcm_giftOffer.currency.AED=AED, UAE dirham
ctcm_giftOffer.currency.SAR=SAR, Saudi riyal
ctcm_giftOffer.currency.EGP=EGP, Egyptian pound
ctcm_giftOffer.currency.KWD=KWD, Kuwaiti dinar
ctcm_giftOffer.currency.QAR=QAR, Qatari riyal
ctcm_giftOffer.currency.BHD=BHD, Bahraini dinar
ctcm_giftOffer.currency.OMR=OMR, Omani rial
ctcm_giftOffer.currency.USD=USD, US dollar
ctcm_giftOffer.currency.EUR=EUR, euro
ctcm_giftOffer.currency.GBP=GBP, pound sterling
ctcm_giftOffer.conditions=Conditions
ctcm_giftOffer.conditions.ui.tooltip=<b>Conditions</b>: the small print, for example <i>While stocks last, one gift per order</i>.
ctcm_giftOffer.endsOn=Last day
ctcm_giftOffer.endsOn.ui.tooltip=<b>Last day</b>: the last day of the offer. It leaves the live site the day after. Empty: it stays until you remove it.
ctcm_shopTheLook=Shop the look
ctcm_shopTheLook_description=A look with its picture and the products used in it, in order.
ctcm_shopTheLook.intro=Introduction
ctcm_shopTheLook.intro.ui.tooltip=<b>Introduction</b>: one or two sentences about the look.
