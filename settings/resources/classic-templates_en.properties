# Editor labels for classic-templates. Keys are derived from the DECLARING type (a mixin's fields
# are keyed on the mixin), ':' becomes '_', choicelist values are <type>.<property>.<value>, and a
# type's help text is <type>_description.

# ---- Component tiers and areas ------------------------------------------------------------------
ctplmix_component=Classic templates
ctplmix_component_description=Components of the classic-templates template set.
ctplmix_pageComponent=Page section
ctplmix_heroComponent=Hero banner
ctplmix_headerComponent=Site header
ctplmix_footerComponent=Site footer
ctpl_heroArea=Hero area
ctpl_heroArea_description=Holds the banner shown at the top of the page.
ctpl_pageArea=Page area
ctpl_pageArea_description=Holds the sections of the page, in order.
ctpl_headerArea=Header area
ctpl_headerArea_description=Holds the site header shared by every page. Edit it from the home page.
ctpl_footerArea=Footer area
ctpl_footerArea_description=Holds the site footer shared by every page. Edit it from the home page.

# ---- Links --------------------------------------------------------------------------------------
ctplmix_linkTo=Link
ctplmix_linkTo.j_linkType=Link
ctplmix_linkTo.j_linkType.ui.tooltip=Where the link goes: a page of this site (internal), a web address (external) or nowhere. The target is set for each language.
ctplmix_linkTo.j_linkType.none=No link
ctplmix_linkTo.j_linkType.internal=Page of this site
ctplmix_linkTo.j_linkType.external=Web address
ctplmix_cta=Call to action
ctplmix_cta.ctaLabel=Button label
ctplmix_cta.ctaLabel.ui.tooltip=Text of the button, for example "Read more". Keep it short and explicit: it is read out on its own by screen readers.

# ---- Image --------------------------------------------------------------------------------------
ctplmix_media=Image
ctplmix_media.image=Image
ctplmix_media.image.ui.tooltip=Pick an image from the media library. Unless you write a text alternative below, its title in the library is read to people who cannot see it, so give it a meaningful title in every language.
ctplmix_media.imageAlt=Text alternative
ctplmix_media.imageAlt.ui.tooltip=What the image shows or means on this page, for people who cannot see it. Leave empty to use the image's title in the media library. Ignored when the image is decorative, and on cards and quotes.
ctplmix_media.imageDecorative=Decorative image
ctplmix_media.imageDecorative.ui.tooltip=Check when the image only decorates (a backdrop, an abstract picture): screen readers then skip it.

# ---- Page options -------------------------------------------------------------------------------
ctplmix_pageOptions=Page options
ctplmix_pageOptions.ctplHideFromNav=Hide from navigation
ctplmix_pageOptions.ctplHideFromNav.ui.tooltip=The page stays online and reachable by its address, but does not appear in the main navigation menu.
ctplmix_pageOptions.ctplHideTitle=Hide the page title
ctplmix_pageOptions.ctplHideTitle.ui.tooltip=Removes the page title from the screen when a banner already shows it. The title is kept for screen readers and search engines.
ctplmix_pageOptions.ctplHideBreadcrumb=Hide the breadcrumb
ctplmix_pageOptions.ctplHideBreadcrumb.ui.tooltip=Removes the breadcrumb trail from this page only, for example on a landing page. Has no effect when the breadcrumb is turned off for the whole site.

# ---- Site settings ------------------------------------------------------------------------------
ctplmix_siteSettings=Site look
ctplmix_siteSettings_description=Theme, colour scheme and breadcrumb of the whole site. Changes apply to every page once the site is published.
ctplmix_siteSettings.ctplTheme=Theme
ctplmix_siteSettings.ctplTheme.ui.tooltip=Colours, fonts and shapes used across the site. Changing it alters no content and no layout.
ctplmix_siteSettings.ctplTheme.default=Classic (navy)
ctplmix_siteSettings.ctplTheme.ocean=Ocean (teal)
ctplmix_siteSettings.ctplTheme.terracotta=Terracotta (warm)
ctplmix_siteSettings.ctplTheme.horizon=Horizon (navy and orange)
ctplmix_siteSettings.ctplColorScheme=Light or dark
ctplmix_siteSettings.ctplColorScheme.ui.tooltip=Automatic follows each visitor's system setting. Light or dark forces one scheme for everybody.
ctplmix_siteSettings.ctplColorScheme.auto=Automatic
ctplmix_siteSettings.ctplColorScheme.light=Always light
ctplmix_siteSettings.ctplColorScheme.dark=Always dark
ctplmix_siteSettings.ctplShowBreadcrumb=Show the breadcrumb
ctplmix_siteSettings.ctplShowBreadcrumb.ui.tooltip=Shows the path to the current page (for example Home > Services > Support) above the content of every page except the home page. A page can still hide it in its page options.

# ---- Links and link lists -----------------------------------------------------------------------
ctpl_link=Link
ctpl_link_description=One link: a page of this site or a web address, with its label.
ctpl_link.openInNewTab=Open in a new tab
ctpl_link.openInNewTab.ui.tooltip=Use sparingly, for documents or other sites. Screen readers announce that the link opens a new tab.
ctpl_linkList=Link list
ctpl_linkList_description=An ordered list of links with an optional title. Used for the header utility links, the footer columns and in pages.

# ---- Navigation ---------------------------------------------------------------------------------
ctpl_mainNavigation=Main navigation
ctpl_mainNavigation_description=The site menu, built from the pages under the home page. Reorder, rename or hide pages to change it.
ctpl_mainNavigation.navDepth=Menu depth
ctpl_mainNavigation.navDepth.ui.tooltip=How many levels of pages the menu shows, from 1 (top-level pages only) to 3.
ctpl_languageSwitcher=Language switcher
ctpl_languageSwitcher_description=Links to the current page in the other languages of the site. Hidden when the site has one language.

# ---- Header and footer --------------------------------------------------------------------------
ctpl_siteHeader=Site header
ctpl_siteHeader_description=Logo, utility links, language switcher and main navigation, shared by every page. Edit it from the home page.
ctpl_siteHeader.logo=Logo
ctpl_siteHeader.logo.ui.tooltip=Logo shown at the top left, linking to the home page. An SVG or a PNG about 44 pixels high works best.
ctpl_siteHeader.logoDark=Logo for dark mode
ctpl_siteHeader.logoDark.ui.tooltip=Optional light-coloured version of the logo, used when the site is shown in dark mode.
ctpl_siteHeader.brandName=Brand name
ctpl_siteHeader.brandName.ui.tooltip=Name shown next to the logo. Leave empty to use the site title.
ctpl_siteHeader.showBrandName=Show the brand name
ctpl_siteHeader.showBrandName.ui.tooltip=Untick when the logo already contains the name. The name is then used as the logo's alternative text.
ctpl_siteFooter=Site footer
ctpl_siteFooter_description=Tagline, link columns, copyright, legal and social links, shared by every page. Edit it from the home page.
ctpl_siteFooter.tagline=Tagline
ctpl_siteFooter.tagline.ui.tooltip=One or two sentences under the site name in the footer.
ctpl_siteFooter.copyright=Copyright
ctpl_siteFooter.copyright.ui.tooltip=Copyright line, for example "© {year} Company". {year} is replaced with the current year.
ctpl_footerColumns=Footer columns
ctpl_footerColumns_description=The columns of links in the footer. Each column is a link list with a title.

# ---- Section style ------------------------------------------------------------------------------
ctplmix_sectionStyle=Section style
ctplmix_sectionStyle.ctplSurface=Background
ctplmix_sectionStyle.ctplSurface.ui.tooltip=Background of the section, taken from the site theme. Alternate backgrounds to separate consecutive sections.
ctplmix_sectionStyle.ctplSurface.default=Page background
ctplmix_sectionStyle.ctplSurface.sunken=Light band
ctplmix_sectionStyle.ctplSurface.accent=Accent tint

# ---- Content sections ---------------------------------------------------------------------------
ctpl_heroBanner=Hero banner
ctpl_heroBanner_description=A large banner with a heading, a short text, an optional photo and a button. Place it at the top of a page or between sections.
ctpl_heroBanner.eyebrow=Eyebrow
ctpl_heroBanner.eyebrow.ui.tooltip=Short line shown above the heading, for example a category or a date. Keep it to a few words.
ctpl_heroBanner.subtitle=Subtitle
ctpl_heroBanner.subtitle.ui.tooltip=One or two sentences shown under the heading.
ctpl_heroBanner.variant=Layout
ctpl_heroBanner.variant.ui.tooltip=How the banner is laid out: text over a full-width photo, text beside the photo, or text on a tinted band without a photo.
ctpl_heroBanner.variant.image=Text over the photo
ctpl_heroBanner.variant.split=Text beside the photo
ctpl_heroBanner.variant.plain=Tinted band, no photo
ctpl_heroBanner.overlay=Photo darkening
ctpl_heroBanner.overlay.ui.tooltip=How much the photo is darkened behind the text, so the text stays readable. Only used with the "Text over the photo" layout. Choose "Strong" for bright or busy photos.
ctpl_heroBanner.overlay.medium=Medium
ctpl_heroBanner.overlay.strong=Strong
ctpl_heroBanner.height=Height
ctpl_heroBanner.height.ui.tooltip=How tall the banner is on large screens. On phones the banner grows with its text.
ctpl_heroBanner.height.compact=Compact
ctpl_heroBanner.height.medium=Medium
ctpl_heroBanner.height.tall=Tall
ctpl_imageText=Image and text
ctpl_imageText_description=A section with an image beside a heading, a text and an optional button.
ctpl_imageText.body=Text
ctpl_imageText.body.ui.tooltip=Text shown beside the image. Use headings level 3 and below inside it: the section title is already a level 2 heading.
ctpl_imageText.imagePosition=Image position
ctpl_imageText.imagePosition.ui.tooltip=Side of the section where the image is shown. On phones the image is always shown above the text.
ctpl_imageText.imagePosition.left=Left
ctpl_imageText.imagePosition.right=Right
ctpl_imageText.imageRatio=Image shape
ctpl_imageText.imageRatio.ui.tooltip=Shape the image is cropped to. The centre of the image is kept.
ctpl_imageText.imageRatio.landscape=Landscape
ctpl_imageText.imageRatio.square=Square
ctpl_imageText.imageRatio.portrait=Portrait
ctpl_richText=Text
ctpl_richText_description=A section of formatted text with an optional title.
ctpl_richText.body=Text
ctpl_richText.body.ui.tooltip=Content of the section. Use headings level 3 and below inside it when the section has a title, which is a level 2 heading.
ctpl_richText.width=Text width
ctpl_richText.width.ui.tooltip=Readable keeps lines short and easy to read. Wide uses the full width of the page, for tables or long lists.
ctpl_richText.width.readable=Readable
ctpl_richText.width.wide=Wide

# ---- Layout -------------------------------------------------------------------------------------
ctpl_column=Column
ctpl_column_description=One column of a columns row. Add page sections to it.
ctpl_columns=Columns
ctpl_columns_description=A row of 2 to 4 columns, each holding its own page sections, with an optional title.
ctpl_columns.layout=Column layout
ctpl_columns.layout.ui.tooltip=Number and widths of the columns. Content in columns that the layout does not show is kept, and comes back if you switch layout again. On phones the columns are stacked.
ctpl_columns.layout.halves=Two equal columns
ctpl_columns.layout.thirds=Three equal columns
ctpl_columns.layout.quarters=Four equal columns
ctpl_columns.layout.twoThirdsOneThird=Wide column then narrow column
ctpl_columns.layout.oneThirdTwoThirds=Narrow column then wide column
ctpl_columns.gap=Space between columns
ctpl_columns.gap.ui.tooltip=How much space separates the columns.
ctpl_columns.gap.small=Small
ctpl_columns.gap.medium=Medium
ctpl_columns.gap.large=Large

# ---- Editorial content --------------------------------------------------------------------------
ctplmix_listable=News and articles
ctplmix_listable_description=Content that a content list can show.
ctplmix_editorialItem=News and articles
ctplmix_editorialItem_description=Any news item or article.
ctplmix_editorialItem.teaser=Teaser
ctplmix_editorialItem.teaser.ui.tooltip=One or two sentences shown on cards and under the title of the full page. Also used as the page description for search engines.
ctplmix_editorialItem.body=Body
ctplmix_editorialItem.body.ui.tooltip=The full text, shown on the item's own page.
ctplmix_editorialItem.publicationDate=Publication date
ctplmix_editorialItem.publicationDate.ui.tooltip=Date shown to visitors and used to sort lists, newest first. Leave empty to use the creation date.
ctpl_news=News item
ctpl_news_description=A dated news item with a teaser, a body and an image. It has its own page and appears in content lists.
ctpl_article=Article
ctpl_article_description=A longer article with a teaser, a body, an image and its author. It has its own page and appears in content lists.
ctpl_article.author=Author
ctpl_article.author.ui.tooltip=Name of the author as shown to visitors, for example "Jane Smith". It is the same in every language.
ctpl_jcrQuery=Content list
ctpl_jcrQuery_description=A section that lists news items or articles automatically, with an optional title and a "see all" link.
ctpl_jcrQuery.type=Content to list
ctpl_jcrQuery.type.ui.tooltip=Type of content the list shows, for example news items or articles.
ctpl_jcrQuery.startNode=Look under
ctpl_jcrQuery.startNode.ui.tooltip=Folder or page under which to look for content. Leave empty to list content from the whole site.
ctpl_jcrQuery.criteria=Sort by
ctpl_jcrQuery.criteria.ui.tooltip=Order of the items in the list.
ctpl_jcrQuery.criteria.publicationDate=Publication date
ctpl_jcrQuery.criteria.jcr_created=Creation date
ctpl_jcrQuery.criteria.jcr_lastModified=Last modification date
ctpl_jcrQuery.criteria.jcr_title=Title
ctpl_jcrQuery.sortDirection=Sort direction
ctpl_jcrQuery.sortDirection.ui.tooltip=Descending shows the newest items (or titles from Z to A) first. Ascending shows the oldest (or titles from A to Z) first.
ctpl_jcrQuery.sortDirection.desc=Descending
ctpl_jcrQuery.sortDirection.asc=Ascending
ctpl_jcrQuery.maxItems=Number of items
ctpl_jcrQuery.maxItems.ui.tooltip=Maximum number of items shown, from 1 to 50. Use the "see all" link to lead visitors to the full list.
ctpl_jcrQuery.layout=Display
ctpl_jcrQuery.layout.ui.tooltip=Cards show the image and the teaser of each item in a grid. Compact list shows one row per item with its title and date.
ctpl_jcrQuery.layout.grid=Cards
ctpl_jcrQuery.layout.list=Compact list
ctpl_jcrQuery.excludeNodes=Items to leave out
ctpl_jcrQuery.excludeNodes.ui.tooltip=Items never shown in this list, for example the one already featured above it on the page.
ctpl_jcrQuery.noResultText=Text when empty
ctpl_jcrQuery.noResultText.ui.tooltip=Text shown when there is nothing to list. Leave empty to hide the section in that case.
ctpl_jcrQuery.filterCategories=Categories
ctpl_jcrQuery.filterCategories.ui.tooltip=Only list items in one of these categories, or in one of their subcategories. Leave empty to list items of every category.

# ---- Cards, key figures and quotes --------------------------------------------------------------
ctpl_card=Card
ctpl_card_description=A card with a title, a short text, an image and a link. The whole card is clickable. In a grid shown as icon tiles the image is a small icon; in a logo strip only the image shows.
ctpl_card.text=Text
ctpl_card.text.ui.tooltip=One or two sentences shown under the card title.
ctpl_card.linkLabel=Link text
ctpl_card.linkLabel.ui.tooltip=Optional text shown at the bottom of the card, for example "Discover our services". The whole card is clickable either way. Leave empty to show no link text.
ctpl_contentTeaser=Card of an existing item
ctpl_contentTeaser_description=Shows an existing news item or article as a card, with its own title, image and teaser. The card changes when the item is edited.
ctpl_contentTeaser.j_node=Item to show
ctpl_contentTeaser.j_node.ui.tooltip=Pick a news item or an article. Its card is shown here and links to its page.
ctpl_cardGrid=Card grid
ctpl_cardGrid_description=A section of hand-picked cards in a grid, with an optional title and a lead text. Mix written cards and cards of existing news items or articles.
ctpl_cardGrid.columns=Cards per row
ctpl_cardGrid.columns.ui.tooltip=How many cards sit side by side on large screens. On smaller screens the grid shows fewer cards per row. Only for the Cards display: icon tiles and logos fill the row with as many as fit.
ctpl_cardGrid.columns.2=2 cards
ctpl_cardGrid.columns.3=3 cards
ctpl_cardGrid.columns.4=4 cards
ctpl_cardGrid.display=Display
ctpl_cardGrid.display.ui.tooltip=Cards show each card's image, title and text. Icon tiles show outlined square tiles with the image as a small icon, the title and the text; the whole tile is the link. Logos show the images only, in a strip, each optionally linked: give each logo a text alternative or a card title. Cards of existing items are not shown as logos.
ctpl_cardGrid.display.cards=Cards
ctpl_cardGrid.display.iconTiles=Icon tiles
ctpl_cardGrid.display.logos=Logo strip
ctpl_cardGrid.introText=Lead text
ctpl_cardGrid.introText.ui.tooltip=Optional sentence or two shown under the section title, above the cards.
ctpl_keyFigure=Key figure
ctpl_keyFigure_description=One figure with its label, for example "98%" and "satisfied customers".
ctpl_keyFigure.value=Figure
ctpl_keyFigure.value.ui.tooltip=The figure exactly as visitors read it, for example "98%", "12 000" or "24/7". Write it the way it is written in this language.
ctpl_keyFigure.label=Label
ctpl_keyFigure.label.ui.tooltip=What the figure counts, for example "satisfied customers". Screen readers read it together with the figure.
ctpl_keyFigure.detail=Detail
ctpl_keyFigure.detail.ui.tooltip=Optional short line under the label, for example the source or the year of the figure.
ctpl_keyFigures=Key figures
ctpl_keyFigures_description=A section of key figures in a row, with an optional title and a lead text.
ctpl_keyFigures.introText=Lead text
ctpl_keyFigures.introText.ui.tooltip=Optional sentence or two shown under the section title, above the figures.
ctpl_quote=Quote
ctpl_quote_description=A quotation with the name and role of the person quoted, and an optional portrait from the image field.
ctpl_quote.quote=Quotation
ctpl_quote.quote.ui.tooltip=The words quoted, as plain text, without quotation marks: the site adds them in the style of the page's language.
ctpl_quote.author=Name
ctpl_quote.author.ui.tooltip=Name of the person quoted, for example "Jane Smith". It is the same in every language.
ctpl_quote.authorRole=Role
ctpl_quote.authorRole.ui.tooltip=Role and organisation of the person quoted, for example "Head of customer care, Acme".
ctpl_quote.variant=Size
ctpl_quote.variant.ui.tooltip=Standard fits within the flow of the page. Large shows the quotation in big type, as a pull quote that stands out between sections.
ctpl_quote.variant.standard=Standard
ctpl_quote.variant.large=Large (pull quote)

# ---- Site map -----------------------------------------------------------------------------------
ctpl_siteMap=Site map
ctpl_siteMap_description=Every page of the site as nested lists of links, hidden-from-menu pages included. Put it on a "Site map" page linked from the footer: with the main menu it is the second way to find a page that accessibility rules (RGAA 12.1) ask for.
ctpl_siteMap.depth=Levels shown
ctpl_siteMap.depth.ui.tooltip=How many levels of pages under the home page the map lists, from 1 to 10.

# ---- Free zone (add-ons) ------------------------------------------------------------------------
ctpl_freeZone=Free zone
ctpl_freeZone_description=A section for components of other modules (a FAQ, a media gallery, a store locator, a Formidable form) and core content. It gives them the section's background, heading and width, and the site theme.
ctpl_freeZone.width=Width
ctpl_freeZone.width.ui.tooltip=Page width (aligned with the other sections), reading width (for text and forms) or full width (edge to edge, for maps and galleries).
ctpl_freeZone.width.container=Page width
ctpl_freeZone.width.reading=Reading width
ctpl_freeZone.width.full=Full width

# ---- Accordion ----------------------------------------------------------------------------------
ctpl_accordion=Accordion
ctpl_accordion_description=A section of entries that visitors open and close, for example questions and answers, with an optional title and a lead text.
ctpl_accordion.introText=Lead text
ctpl_accordion.introText.ui.tooltip=Optional sentence or two shown under the section title, above the entries.
ctpl_accordionItem=Accordion entry
ctpl_accordionItem_description=One entry of an accordion: the heading visitors click (for example a question) and the text it reveals.
ctpl_accordionItem.body=Text
ctpl_accordionItem.body.ui.tooltip=Text revealed when the entry is opened, for example the answer. Headings inside it are renumbered under the entry's heading. Tables scroll sideways on small screens.
ctpl_accordionItem.openByDefault=Open when the page loads
ctpl_accordionItem.openByDefault.ui.tooltip=Shows this entry open when the page loads. Keep most entries closed so visitors can scan the headings.

# ---- Tabs ---------------------------------------------------------------------------------------
ctpl_tabs=Tabs
ctpl_tabs_description=A section of tabs, each holding its own page sections (text, accordion, card grid...), with an optional title. Visitors see one tab at a time; without JavaScript every tab shows, one after the other.
ctpl_tab=Tab
ctpl_tab_description=One tab of a tabs section: its label and the page sections it holds. Add sections to it like to a column.
