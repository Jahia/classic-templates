# Libellés éditeur de classic-templates. Voir classic-templates_en.properties pour les règles de clés.

# ---- Niveaux de composants et zones -------------------------------------------------------------
ctplmix_component=Classic templates
ctplmix_component_description=Composants du jeu de gabarits classic-templates.
ctplmix_pageComponent=Section de page
ctplmix_heroComponent=Bannière d'en-tête
ctplmix_headerComponent=En-tête du site
ctplmix_footerComponent=Pied de page du site
ctpl_heroArea=Zone bannière
ctpl_heroArea_description=Contient la bannière affichée en haut de la page.
ctpl_pageArea=Zone de page
ctpl_pageArea_description=Contient les sections de la page, dans l'ordre.
ctpl_headerArea=Zone d'en-tête
ctpl_headerArea_description=Contient l'en-tête commun à toutes les pages. Modifiez-le depuis la page d'accueil.
ctpl_footerArea=Zone de pied de page
ctpl_footerArea_description=Contient le pied de page commun à toutes les pages. Modifiez-le depuis la page d'accueil.

# ---- Liens --------------------------------------------------------------------------------------
ctplmix_linkTo=Lien
ctplmix_linkTo.j_linkType=Lien
ctplmix_linkTo.j_linkType.ui.tooltip=Destination du lien : une page de ce site (interne), une adresse web (externe) ou aucune. La cible se définit pour chaque langue.
ctplmix_linkTo.j_linkType.none=Aucun lien
ctplmix_linkTo.j_linkType.internal=Page de ce site
ctplmix_linkTo.j_linkType.external=Adresse web
ctplmix_cta=Appel à l'action
ctplmix_cta.ctaLabel=Libellé du bouton
ctplmix_cta.ctaLabel.ui.tooltip=Texte du bouton, par exemple « En savoir plus ». Restez court et explicite : les lecteurs d'écran le lisent seul.

# ---- Image --------------------------------------------------------------------------------------
ctplmix_media=Image
ctplmix_media.image=Image
ctplmix_media.image.ui.tooltip=Choisissez une image de la médiathèque. Son titre dans la médiathèque sert de texte alternatif : donnez-lui un titre parlant.

# ---- Options de page ----------------------------------------------------------------------------
ctplmix_pageOptions=Options de page
ctplmix_pageOptions.ctplHideFromNav=Masquer dans la navigation
ctplmix_pageOptions.ctplHideFromNav.ui.tooltip=La page reste en ligne et accessible par son adresse, mais n'apparaît pas dans le menu principal.
ctplmix_pageOptions.ctplHideTitle=Masquer le titre de la page
ctplmix_pageOptions.ctplHideTitle.ui.tooltip=Retire le titre de l'écran quand une bannière l'affiche déjà. Le titre reste lu par les lecteurs d'écran et les moteurs de recherche.

# ---- Réglages du site ---------------------------------------------------------------------------
ctplmix_siteSettings=Apparence du site
ctplmix_siteSettings_description=Thème et mode clair ou sombre de tout le site. Les changements s'appliquent à toutes les pages une fois le site publié.
ctplmix_siteSettings.ctplTheme=Thème
ctplmix_siteSettings.ctplTheme.ui.tooltip=Couleurs, polices et formes utilisées sur tout le site. Le changer ne modifie ni le contenu ni la mise en page.
ctplmix_siteSettings.ctplTheme.default=Classique (marine)
ctplmix_siteSettings.ctplTheme.ocean=Océan (sarcelle)
ctplmix_siteSettings.ctplTheme.terracotta=Terracotta (chaud)
ctplmix_siteSettings.ctplColorScheme=Clair ou sombre
ctplmix_siteSettings.ctplColorScheme.ui.tooltip=Automatique suit le réglage système de chaque visiteur. Clair ou sombre impose un mode à tous.
ctplmix_siteSettings.ctplColorScheme.auto=Automatique
ctplmix_siteSettings.ctplColorScheme.light=Toujours clair
ctplmix_siteSettings.ctplColorScheme.dark=Toujours sombre

# ---- Liens et listes de liens -------------------------------------------------------------------
ctpl_link=Lien
ctpl_link_description=Un lien : une page de ce site ou une adresse web, avec son libellé.
ctpl_link.openInNewTab=Ouvrir dans un nouvel onglet
ctpl_link.openInNewTab.ui.tooltip=À utiliser avec parcimonie, pour des documents ou d'autres sites. Les lecteurs d'écran annoncent que le lien ouvre un nouvel onglet.
ctpl_linkList=Liste de liens
ctpl_linkList_description=Une liste ordonnée de liens avec un titre facultatif. Sert aux liens utilitaires de l'en-tête, aux colonnes du pied de page et dans les pages.

# ---- Navigation ---------------------------------------------------------------------------------
ctpl_mainNavigation=Navigation principale
ctpl_mainNavigation_description=Le menu du site, construit à partir des pages sous la page d'accueil. Réordonnez, renommez ou masquez des pages pour le modifier.
ctpl_mainNavigation.navDepth=Profondeur du menu
ctpl_mainNavigation.navDepth.ui.tooltip=Nombre de niveaux de pages affichés par le menu, de 1 (pages de premier niveau seulement) à 3.
ctpl_languageSwitcher=Sélecteur de langue
ctpl_languageSwitcher_description=Liens vers la page courante dans les autres langues du site. Masqué quand le site n'a qu'une langue.

# ---- En-tête et pied de page --------------------------------------------------------------------
ctpl_siteHeader=En-tête du site
ctpl_siteHeader_description=Logo, liens utilitaires, sélecteur de langue et navigation principale, communs à toutes les pages. Modifiez-le depuis la page d'accueil.
ctpl_siteHeader.logo=Logo
ctpl_siteHeader.logo.ui.tooltip=Logo affiché en haut à gauche, qui mène à la page d'accueil. Un SVG ou un PNG d'environ 44 pixels de haut convient le mieux.
ctpl_siteHeader.logoDark=Logo pour le mode sombre
ctpl_siteHeader.logoDark.ui.tooltip=Version claire du logo, facultative, utilisée quand le site s'affiche en mode sombre.
ctpl_siteHeader.brandName=Nom de marque
ctpl_siteHeader.brandName.ui.tooltip=Nom affiché à côté du logo. Laissez vide pour utiliser le titre du site.
ctpl_siteHeader.showBrandName=Afficher le nom de marque
ctpl_siteHeader.showBrandName.ui.tooltip=Décochez quand le logo contient déjà le nom. Le nom sert alors de texte alternatif au logo.
ctpl_siteFooter=Pied de page du site
ctpl_siteFooter_description=Accroche, colonnes de liens, copyright, liens légaux et réseaux sociaux, communs à toutes les pages. Modifiez-le depuis la page d'accueil.
ctpl_siteFooter.tagline=Accroche
ctpl_siteFooter.tagline.ui.tooltip=Une ou deux phrases sous le nom du site, dans le pied de page.
ctpl_siteFooter.copyright=Copyright
ctpl_siteFooter.copyright.ui.tooltip=Ligne de copyright, par exemple « © {year} Société ». {year} est remplacé par l'année en cours.
ctpl_footerColumns=Colonnes du pied de page
ctpl_footerColumns_description=Les colonnes de liens du pied de page. Chaque colonne est une liste de liens avec un titre.

# ---- Style de section ---------------------------------------------------------------------------
ctplmix_sectionStyle=Style de section
ctplmix_sectionStyle.ctplSurface=Fond
ctplmix_sectionStyle.ctplSurface.ui.tooltip=Fond de la section, issu du thème du site. Alternez les fonds pour séparer des sections consécutives.
ctplmix_sectionStyle.ctplSurface.default=Fond de page
ctplmix_sectionStyle.ctplSurface.sunken=Bande claire
ctplmix_sectionStyle.ctplSurface.accent=Teinte d'accent

# ---- Sections de contenu ------------------------------------------------------------------------
ctpl_heroBanner=Bannière
ctpl_heroBanner_description=Une grande bannière avec un titre, un court texte, une photo facultative et un bouton. À placer en haut d'une page ou entre deux sections.
ctpl_heroBanner.eyebrow=Surtitre
ctpl_heroBanner.eyebrow.ui.tooltip=Courte ligne affichée au-dessus du titre, par exemple une rubrique ou une date. Quelques mots suffisent.
ctpl_heroBanner.subtitle=Sous-titre
ctpl_heroBanner.subtitle.ui.tooltip=Une ou deux phrases affichées sous le titre.
ctpl_heroBanner.variant=Disposition
ctpl_heroBanner.variant.ui.tooltip=Disposition de la bannière : texte sur une photo pleine largeur, texte à côté de la photo, ou texte sur un bandeau teinté sans photo.
ctpl_heroBanner.variant.image=Texte sur la photo
ctpl_heroBanner.variant.split=Texte à côté de la photo
ctpl_heroBanner.variant.plain=Bandeau teinté, sans photo
ctpl_heroBanner.overlay=Assombrissement de la photo
ctpl_heroBanner.overlay.ui.tooltip=Degré d'assombrissement de la photo derrière le texte, pour qu'il reste lisible. Utilisé uniquement avec la disposition « Texte sur la photo ». Choisissez « Fort » pour une photo claire ou chargée.
ctpl_heroBanner.overlay.medium=Moyen
ctpl_heroBanner.overlay.strong=Fort
ctpl_heroBanner.height=Hauteur
ctpl_heroBanner.height.ui.tooltip=Hauteur de la bannière sur grand écran. Sur téléphone, la bannière s'adapte à son texte.
ctpl_heroBanner.height.compact=Compacte
ctpl_heroBanner.height.medium=Moyenne
ctpl_heroBanner.height.tall=Haute
ctpl_imageText=Image et texte
ctpl_imageText_description=Une section avec une image à côté d'un titre, d'un texte et d'un bouton facultatif.
ctpl_imageText.body=Texte
ctpl_imageText.body.ui.tooltip=Texte affiché à côté de l'image. Utilisez des intertitres de niveau 3 ou inférieur : le titre de la section est déjà de niveau 2.
ctpl_imageText.imagePosition=Position de l'image
ctpl_imageText.imagePosition.ui.tooltip=Côté de la section où s'affiche l'image. Sur téléphone, l'image s'affiche toujours au-dessus du texte.
ctpl_imageText.imagePosition.left=À gauche
ctpl_imageText.imagePosition.right=À droite
ctpl_imageText.imageRatio=Format de l'image
ctpl_imageText.imageRatio.ui.tooltip=Format dans lequel l'image est recadrée. Le centre de l'image est conservé.
ctpl_imageText.imageRatio.landscape=Paysage
ctpl_imageText.imageRatio.square=Carré
ctpl_imageText.imageRatio.portrait=Portrait
ctpl_richText=Texte
ctpl_richText_description=Une section de texte mis en forme, avec un titre facultatif.
ctpl_richText.body=Texte
ctpl_richText.body.ui.tooltip=Contenu de la section. Si la section a un titre (niveau 2), utilisez des intertitres de niveau 3 ou inférieur.
ctpl_richText.width=Largeur du texte
ctpl_richText.width.ui.tooltip=« Lisible » garde des lignes courtes et faciles à lire. « Large » utilise toute la largeur de la page, pour des tableaux ou de longues listes.
ctpl_richText.width.readable=Lisible
ctpl_richText.width.wide=Large

# ---- Mise en page -------------------------------------------------------------------------------
ctpl_column=Colonne
ctpl_column_description=Une colonne d'une rangée de colonnes. Ajoutez-y des sections de page.
ctpl_columns=Colonnes
ctpl_columns_description=Une rangée de 2 à 4 colonnes, chacune avec ses propres sections de page, et un titre facultatif.
ctpl_columns.layout=Disposition des colonnes
ctpl_columns.layout.ui.tooltip=Nombre et largeur des colonnes. Le contenu des colonnes masquées par la disposition est conservé et réapparaît si vous changez à nouveau de disposition. Sur téléphone, les colonnes sont empilées.
ctpl_columns.layout.halves=Deux colonnes égales
ctpl_columns.layout.thirds=Trois colonnes égales
ctpl_columns.layout.quarters=Quatre colonnes égales
ctpl_columns.layout.twoThirdsOneThird=Colonne large puis colonne étroite
ctpl_columns.layout.oneThirdTwoThirds=Colonne étroite puis colonne large
ctpl_columns.gap=Espace entre les colonnes
ctpl_columns.gap.ui.tooltip=Espace qui sépare les colonnes.
ctpl_columns.gap.small=Petit
ctpl_columns.gap.medium=Moyen
ctpl_columns.gap.large=Grand

# ---- Contenu éditorial --------------------------------------------------------------------------
ctplmix_listable=Actualités et articles
ctplmix_listable_description=Contenu qu'une liste de contenus peut afficher.
ctplmix_editorialItem=Actualités et articles
ctplmix_editorialItem_description=Une actualité ou un article.
ctplmix_editorialItem.teaser=Accroche
ctplmix_editorialItem.teaser.ui.tooltip=Une ou deux phrases affichées sur les cartes et sous le titre de la page complète. Sert aussi de description pour les moteurs de recherche.
ctplmix_editorialItem.body=Corps
ctplmix_editorialItem.body.ui.tooltip=Le texte complet, affiché sur la page de l'élément.
ctplmix_editorialItem.publicationDate=Date de publication
ctplmix_editorialItem.publicationDate.ui.tooltip=Date affichée aux visiteurs et utilisée pour trier les listes, du plus récent au plus ancien. Laissez vide pour utiliser la date de création.
ctpl_news=Actualité
ctpl_news_description=Une actualité datée, avec une accroche, un corps de texte et une image. Elle a sa propre page et apparaît dans les listes de contenus.
ctpl_article=Article
ctpl_article_description=Un article plus long, avec une accroche, un corps de texte, une image et son auteur. Il a sa propre page et apparaît dans les listes de contenus.
ctpl_article.author=Auteur
ctpl_article.author.ui.tooltip=Nom de l'auteur tel qu'il est affiché aux visiteurs, par exemple « Marie Dupont ». Il est identique dans toutes les langues.
ctpl_jcrQuery=Liste de contenus
ctpl_jcrQuery_description=Une section qui liste automatiquement des actualités ou des articles, avec un titre facultatif et un lien « Voir tout ».
ctpl_jcrQuery.type=Contenus à lister
ctpl_jcrQuery.type.ui.tooltip=Type de contenu affiché par la liste, par exemple des actualités ou des articles.
ctpl_jcrQuery.startNode=Chercher sous
ctpl_jcrQuery.startNode.ui.tooltip=Dossier ou page sous lequel chercher les contenus. Laissez vide pour lister les contenus de tout le site.
ctpl_jcrQuery.criteria=Trier par
ctpl_jcrQuery.criteria.ui.tooltip=Ordre des éléments dans la liste.
ctpl_jcrQuery.criteria.publicationDate=Date de publication
ctpl_jcrQuery.criteria.jcr_created=Date de création
ctpl_jcrQuery.criteria.jcr_lastModified=Date de dernière modification
ctpl_jcrQuery.criteria.jcr_title=Titre
ctpl_jcrQuery.sortDirection=Sens du tri
ctpl_jcrQuery.sortDirection.ui.tooltip=Décroissant affiche d'abord les éléments les plus récents (ou les titres de Z à A). Croissant affiche d'abord les plus anciens (ou les titres de A à Z).
ctpl_jcrQuery.sortDirection.desc=Décroissant
ctpl_jcrQuery.sortDirection.asc=Croissant
ctpl_jcrQuery.maxItems=Nombre d'éléments
ctpl_jcrQuery.maxItems.ui.tooltip=Nombre maximum d'éléments affichés, de 1 à 50. Utilisez le lien « Voir tout » pour mener les visiteurs à la liste complète.
ctpl_jcrQuery.layout=Affichage
ctpl_jcrQuery.layout.ui.tooltip=Les cartes montrent l'image et l'accroche de chaque élément dans une grille. La liste compacte montre une ligne par élément, avec son titre et sa date.
ctpl_jcrQuery.layout.grid=Cartes
ctpl_jcrQuery.layout.list=Liste compacte
ctpl_jcrQuery.excludeNodes=Éléments à exclure
ctpl_jcrQuery.excludeNodes.ui.tooltip=Éléments jamais affichés dans cette liste, par exemple celui déjà mis en avant plus haut dans la page.
ctpl_jcrQuery.noResultText=Texte si la liste est vide
ctpl_jcrQuery.noResultText.ui.tooltip=Texte affiché quand il n'y a rien à lister. Laissez vide pour masquer la section dans ce cas.
