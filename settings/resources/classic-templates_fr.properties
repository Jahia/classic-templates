# Libellés éditeur de classic-templates. Voir classic-templates_en.properties pour les règles de clés.

# ---- Niveaux de composants et zones -------------------------------------------------------------
ctplmix_component=Classic templates
ctplmix_component_description=Composants du jeu de gabarits classic-templates.
ctplmix_pageComponent=Section de page
ctplmix_heroComponent=Bannière d'en-tête
ctplmix_headerComponent=En-tête du site
ctplmix_footerComponent=Pied de page du site
ctpl_heroArea=Zone bannière
ctpl_heroArea_description=Contient la bannière affichée en haut de la page.
ctpl_pageArea=Zone de page
ctpl_pageArea_description=Contient les sections de la page, dans l'ordre.
ctpl_headerArea=Zone d'en-tête
ctpl_headerArea_description=Contient l'en-tête commun à toutes les pages. Modifiez-le depuis la page d'accueil.
ctpl_footerArea=Zone de pied de page
ctpl_footerArea_description=Contient le pied de page commun à toutes les pages. Modifiez-le depuis la page d'accueil.

# ---- Liens --------------------------------------------------------------------------------------
ctplmix_linkTo=Lien
ctplmix_linkTo.j_linkType=Lien
ctplmix_linkTo.j_linkType.ui.tooltip=Destination du lien : une page de ce site (interne), une adresse web (externe) ou aucune. La cible se définit pour chaque langue.
ctplmix_linkTo.j_linkType.none=Aucun lien
ctplmix_linkTo.j_linkType.internal=Page de ce site
ctplmix_linkTo.j_linkType.external=Adresse web
ctplmix_cta=Appel à l'action
ctplmix_cta.ctaLabel=Libellé du bouton
ctplmix_cta.ctaLabel.ui.tooltip=Texte du bouton, par exemple « En savoir plus ». Restez court et explicite : les lecteurs d'écran le lisent seul.

# ---- Image --------------------------------------------------------------------------------------
ctplmix_media=Image
ctplmix_media.image=Image
ctplmix_media.image.ui.tooltip=Choisissez une image de la médiathèque. Son titre dans la médiathèque sert de texte alternatif : donnez-lui un titre parlant.

# ---- Options de page ----------------------------------------------------------------------------
ctplmix_pageOptions=Options de page
ctplmix_pageOptions.ctplHideFromNav=Masquer dans la navigation
ctplmix_pageOptions.ctplHideFromNav.ui.tooltip=La page reste en ligne et accessible par son adresse, mais n'apparaît pas dans le menu principal.
ctplmix_pageOptions.ctplHideTitle=Masquer le titre de la page
ctplmix_pageOptions.ctplHideTitle.ui.tooltip=Retire le titre de l'écran quand une bannière l'affiche déjà. Le titre reste lu par les lecteurs d'écran et les moteurs de recherche.

# ---- Réglages du site ---------------------------------------------------------------------------
ctplmix_siteSettings=Apparence du site
ctplmix_siteSettings_description=Thème et mode clair ou sombre de tout le site. Les changements s'appliquent à toutes les pages une fois le site publié.
ctplmix_siteSettings.ctplTheme=Thème
ctplmix_siteSettings.ctplTheme.ui.tooltip=Couleurs, polices et formes utilisées sur tout le site. Le changer ne modifie ni le contenu ni la mise en page.
ctplmix_siteSettings.ctplTheme.default=Classique (marine)
ctplmix_siteSettings.ctplTheme.ocean=Océan (sarcelle)
ctplmix_siteSettings.ctplTheme.terracotta=Terracotta (chaud)
ctplmix_siteSettings.ctplColorScheme=Clair ou sombre
ctplmix_siteSettings.ctplColorScheme.ui.tooltip=Automatique suit le réglage système de chaque visiteur. Clair ou sombre impose un mode à tous.
ctplmix_siteSettings.ctplColorScheme.auto=Automatique
ctplmix_siteSettings.ctplColorScheme.light=Toujours clair
ctplmix_siteSettings.ctplColorScheme.dark=Toujours sombre
