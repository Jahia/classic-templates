mutation setHeaderRegisterPage($headerPath: String!, $register: String!) {
    jcr {
        mutateNode(pathOrId: $headerPath) {
            setPropertiesBatch(
                properties: [{ name: "showAccount", value: "true" }, { name: "j:view", value: "twoRows" }]
            ) {
                path
            }
            registerPage: mutateProperty(name: "registerPage") {
                setValue(value: $register, type: WEAKREFERENCE)
            }
        }
    }
}
